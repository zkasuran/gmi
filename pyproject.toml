[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gmi"
version = "1.0.2"
description = "The community command line for GMI Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["click==8.1.8", "httpx==0.28.1", "prompt_toolkit==3.0.52", "rich==14.2.0", "tomli==2.2.1; python_version < '3.11'"]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
test = ["mcp==2.3.0", "pytest==8.3.5", "pexpect==4.9.0", "pyte==0.8.2", "pyyaml==6.0.2"]

[project.scripts]
gmi = "gmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gmi = ["api_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real GMI API (requires GMI_API_KEY)", "live_media: generates small media artifacts (requires GMI_API_KEY)"]
