  /snapshots:
    post:
      tags:
        - SandboxSnapshot
      summary: Create a durable snapshot
      description: |
        Creates a durable snapshot from a running sandbox in the current tenant.
        The snapshot can be queried immediately, while creation completes asynchronously.
        Poll GET /snapshots/{snapshot_id} until `status` becomes `ready` or `error`.
        A ready snapshot can be supplied as `snapshot_id` to POST /sandboxes.
        A snapshot captures the sandbox filesystem only: running processes and
        in-memory state are not preserved, and a sandbox created from it boots fresh
        from the saved disk. The source sandbox keeps running.
        If snapshot creation is unsupported for the source sandbox, the request
        returns 422 `Snapshot.UnsupportedOnProvider`.

        `Idempotency-Key` is optional. Within the 24-hour deduplication window,
        repeating a key with identical parameters returns the same snapshot with its
        current status and `Idempotency-Replayed: true`, including while `creating`
        and after it becomes `ready`. Different parameters return 400
        `Sandbox.IdempotentParameterMismatch`. Without the header, no deduplication
        is performed.

        The source sandbox must be `running`, otherwise 409 `Snapshot.SourceNotRunning`.
        While another snapshot of the same sandbox is being created, a new request
        may return 409 `Snapshot.CreateInProgress`, including temporarily after a
        previous snapshot was cancelled with DELETE. Wait before retrying and ensure
        the source sandbox is `running`.

        A definitive snapshot creation failure returns 201 with a queryable snapshot in
        `error` and `failure_code: Snapshot.ProviderCreateFailed`. Replaying that
        key returns the same error snapshot without creating another.

        Some failed creation attempts consume the idempotency key; replay returns
        409 `Sandbox.IdempotentKeyConsumed`. Error details include `failure_code`
        and `snapshot_id`; the failed snapshot remains readable through GET.
        Retry with a new `Idempotency-Key`. A deleted snapshot also consumes its
        original key.

        Non-empty names are case-sensitive and unique within the organization across
        all IDCs. A name held by another snapshot returns 409 `Resource.AlreadyExists`.
        Empty names may be shared. Creation failure clears the name atomically;
        the failed record remains readable by snapshot_id. Use a new Idempotency-Key
        to retry with the same name once the source sandbox is running again.
        Name release does not change whether a key can be replayed. A definitive
        Snapshot.ProviderCreateFailed result remains replayable and returns the
        current record, whose name is cleared on failure. Failures detected while
        the create request is being handled, such as a source lease or workflow
        handoff failure, consume the key; replay returns 409
        Sandbox.IdempotentKeyConsumed without a snapshot record. Failures settled
        later in the background, such as a failed creation workflow or an expired
        creation deadline, leave the key replayable; replay returns the current
        error record with its cleared name.
        Use snapshot_id to query a failed attempt; use a new key to create another.
      operationId: createSandboxSnapshot
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptionalParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxSnapshotRequest'
      responses:
        '201':
          description: Snapshot record is addressable; status may be creating, ready, or error.
          headers:
            Idempotency-Replayed:
              description: Present and true when the original request was replayed.
              schema:
                type: boolean
            Idempotency-Key:
              description: The accepted idempotency key, when supplied.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Name conflict (Resource.AlreadyExists), source not running (Snapshot.SourceNotRunning), capture in progress (Snapshot.CreateInProgress), consumed key (Sandbox.IdempotentKeyConsumed), or IDC maintenance (IDC.UnderMaintenance).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - SandboxSnapshot
      summary: List durable snapshots
      description: |
        Lists snapshots in the current tenant, including `deleting` and `delete_failed`.
        Deleted snapshots are excluded. Filtering by `status=deleted` returns 400.
      operationId: listSandboxSnapshots
      parameters:
        - $ref: '#/components/parameters/IdcNameQueryParam'
        - name: source_sandbox_id
          in: query
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          schema:
            type: string
            maxLength: 255
        - name: status
          in: query
          schema:
            type: string
            enum: [creating, ready, error, deleting, delete_failed]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Durable snapshots were returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSandboxSnapshotsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /snapshots/{snapshot_id}:
    parameters:
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - SandboxSnapshot
      summary: Get a durable snapshot
      description: |
        Returns a snapshot in the current tenant. Missing, deleted, or other-tenant
        snapshots return 404. Malformed snapshot identifiers return 400.
      operationId: getSandboxSnapshot
      responses:
        '200':
          description: Durable snapshot details were returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - SandboxSnapshot
      summary: Update a durable snapshot
      description: |
        Updates the customer-defined name and/or metadata. Omitted fields remain unchanged.
        Use an empty string to clear the name or an empty object to clear metadata;
        metadata replaces the entire existing map.

        Only snapshots in `ready` or `error` can be edited. Other addressable states
        return 409 `Resource.StateConflict`, with the current status at the time
        the update was refused.

        Non-empty names are case-sensitive and unique within the organization across
        all IDCs. A name held by another snapshot returns 409 `Resource.AlreadyExists`.
        Explicitly naming an error snapshot again reserves that name.
      operationId: updateSandboxSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSandboxSnapshotRequest'
      responses:
        '200':
          description: Durable snapshot metadata was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Name conflict (Resource.AlreadyExists) or snapshot state does not allow editing (Resource.StateConflict).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - SandboxSnapshot
      summary: Delete a durable snapshot
      description: |
        Accepts asynchronous deletion and returns 202 with `status: deleting`.
        The snapshot remains readable through GET and LIST while deletion completes;
        new sandbox launches from it are rejected. Repeating DELETE while `deleting`
        returns the same accepted response. Once deletion completes, GET returns 404.

        If deletion fails, the snapshot remains queryable in `delete_failed`
        with `failure_code` and `status_reason`. Resolve dependencies and
        repeat DELETE to retry. The snapshot remains unavailable for new launches.
        Existing dependencies that prevent deletion return 409.

        Creating snapshots may be cancelled with DELETE. A new snapshot request
        from the same source may still return 409 `Snapshot.CreateInProgress`
        temporarily after cancellation. Poll GET until 404 or `delete_failed`.

        Deleting and delete_failed records retain their names until deletion completes.
        A 202 response accepts deletion; it does not confirm that the snapshot is deleted.
        A creating snapshot cancelled with DELETE keeps its name until its creation
        deadline passes and deletion completes. A delete_failed snapshot cannot be
        renamed; retry DELETE to release its name.
      operationId: deleteSandboxSnapshot
      responses:
        '202':
          description: Deletion accepted; poll GET until 404 or status=delete_failed.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, data]
                properties:
                  request_id: {type: string}
                  data:
                    type: object
                    required: [snapshot_id, status]
                    properties:
                      snapshot_id: {type: string, format: uuid}
                      status: {type: string, enum: [deleting]}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            State conflict. `Snapshot.HasDependencies`: the snapshot is still referenced by an active resource (for example a sandbox launched from it); remove the dependents and retry. Other state conflicts use `Resource.StateConflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /templates:
    post:
      tags:
      - SandboxTemplate
      summary: Create a Template and start its initial Build
      description: "Creates a logical Template together with its initial Build. The initial\nBuild is created\
        \ and started from the required `build` definition in the\nsame request. A dockerfile that references\
        \ an uploaded file\n(`{{file:...}}`) cannot be used here (400): create the Template without\n`build`,\
        \ upload the file, then start the waiting Build.\n\n`Idempotency-Key`\
        \ is required and acts as the idempotency key because Template\ncreation can complete after an\
        \ upstream timeout; a keyless retry would build a\nsecond Template. Repeating the request with\
        \ identical parameters replays the\nsame Template/Build (with `Idempotency-Replayed: true`); a\
        \ different body under\nthe same key returns 400 `Sandbox.IdempotentParameterMismatch`; after\
        \ the\nTemplate is deleted the key answers 409 `Sandbox.IdempotentKeyConsumed`. Keys\nare remembered\
        \ for 24 hours. (`X-Request-ID` is trace-only and server-generated.)\n\n`resources` selects a catalog\
        \ preset, e.g.\n`{\"type\":\"preset\",\"product\":\"gmi.sandbox.x-large\"}`. The `product`\nvalue\
        \ is the catalog SKU (see `GET /api/v2/products`); the service\nresolves the active entry from the\
        \ product catalog.\n"
      operationId: createTemplate
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyRequiredParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          description: 'The Template record is created and immediately addressable: `GET

            /templates/{id}` works right away, and a failed initial Build

            leaves a rebuildable Template rather than erasing it. Build

            readiness is reported by `status`, not by the status code.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateMutationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'State conflict (`Resource.StateConflict` or an operation-specific code), or the
            selected IDC is under maintenance (`IDC.UnderMaintenance`): write operations are rejected
            until the IDC is usable again. Read operations are unaffected. A Template with the same name
            already exists: `Resource.AlreadyExists`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/Unsupported'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '502':
          $ref: '#/components/responses/UpstreamError'
    get:
      tags:
      - SandboxTemplate
      summary: List Templates
      description: 'Lists Templates visible to the authenticated organization. Results are

        sorted by creation time in descending order. Internal artifact IDs are

        never returned. `name` is an exact match on the Template display name;

        omit it to list every visible Template.

        '
      operationId: listTemplates
      parameters:
      - $ref: '#/components/parameters/IdcNameQueryParam'
      - name: name
        in: query
        description: 'Exact Template display name. Same charset and length as create/PATCH

          (`^[A-Za-z0-9_-]+$`, max 64). Names are unique per organization and data center,

          so omitting `idc_name` may return the same name from more than one data center.

          '
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Templates were returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /templates/{id}:
    parameters:
    - $ref: '#/components/parameters/TemplateIdPathParam'
    - $ref: '#/components/parameters/IdcNameQueryParam'
    get:
      tags:
      - SandboxTemplate
      summary: Get a Template
      description: Returns the logical Template and its current and latest Build references.
      operationId: getTemplate
      responses:
        '200':
          description: The Template was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    patch:
      tags:
      - SandboxTemplate
      summary: Update mutable Template metadata
      description: 'Updates mutable metadata only (`name`, `description`, `labels`).

        IDC, source, resource specification, and existing Build definitions

        are immutable. This is a metadata-only update.


        Renaming to a name already used by another Template in the same

        organization and IDC returns 409.

        '
      operationId: updateTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
      responses:
        '200':
          description: The Template was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    delete:
      tags:
      - SandboxTemplate
      summary: Delete a Template
      description: |
        Accepts deletion and returns 202 with status=deleting. GET and LIST keep
        the Template visible until deletion completes. New sandboxes, derived
        builds, rebuilds and metadata updates are rejected while deleting or delete_failed.
        Once deletion completes, the Template disappears from tenant-visible lists
        and subsequent GET returns 404.
        A dependency conflict during deletion or exhausted retries
        leaves status=delete_failed, failure_code and status_reason. Clear
        dependencies and repeat DELETE to retry. Repeating DELETE during deleting
        returns the same accepted response.
        Tracked dependents (such as child Templates, Snapshots or live Sandboxes)
        and in-progress Builds return 409 before acceptance.
        Child Templates still deleting or delete_failed continue to block deletion.
        Delete dependent resources and wait for their deletion to complete before
        retrying deletion of the parent Template.
        Attempts still unfinished after 24 hours are marked delete_failed.
        Partially deleted Templates remain fenced against new references and updates.
      operationId: deleteTemplate
      responses:
        '202':
          description: Deletion accepted; poll GET until 404 or status=delete_failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDeletionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            State conflict. `Template.HasDependents`: the template is still referenced by an active resource (for example a sandbox created from it, or a derived build); remove the dependents and retry. Other state conflicts use `Resource.StateConflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /templates/{template_id}/files:
    parameters:
    - $ref: '#/components/parameters/TemplateBuildTemplateIdPathParam'
    - $ref: '#/components/parameters/IdcNameQueryParam'
    post:
      tags:
      - SandboxTemplate
      summary: Initialize a Template build-context upload
      description: 'Creates an immutable tar/tgz build context and returns a staging upload

        session. Upload the archive directly with a single HTTP PUT to the

        returned URL and poll the returned status URL; there is no

        client-visible complete operation. The platform verifies the uploaded

        object and imports it into the selected IDC. Backend identity and

        storage object identifiers are never exposed. Maximum declared size is

        1 GiB. `Idempotency-Key` is required. A replay returns the same file

        ID. While the file is still awaiting upload and the archive has not

        been received yet, the replay issues a fresh upload session for the

        same staging object; if the archive has already been received, or the

        file has advanced past `awaiting_upload`, `upload` is omitted and

        callers should poll `status_url`. Once the file is `failed` or

        `expired`, or its upload deadline has passed, the key is consumed and

        the replay returns 409 `Sandbox.IdempotentKeyConsumed` — create a new

        file with a new key.

        '
      operationId: createTemplateFile
      parameters:
      - $ref: '#/components/parameters/TemplateFileIdempotencyKeyRequiredParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateFileRequest'
      responses:
        '201':
          description: 'Staging upload session initialized, or the original result replayed.

            Replays include `Idempotency-Replayed: true`.

            '
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateFileUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The file created under this Idempotency-Key is `failed` or `expired`,

            or its upload deadline has passed; the key is consumed. Retry with a

            new Idempotency-Key to create a new file.


            Also returned as `IDC.UnderMaintenance` when the selected IDC is under maintenance;
            write operations are rejected until the IDC is usable again.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /templates/{template_id}/files/{file_id}:
    parameters:
    - $ref: '#/components/parameters/TemplateBuildTemplateIdPathParam'
    - name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '#/components/parameters/IdcNameQueryParam'
    get:
      tags:
      - SandboxTemplate
      summary: Get Template build-context status
      description: 'Returns the platform-owned lifecycle state of the uploaded build

        context. Backend references and storage object names are never

        returned. Only a ready, unexpired file with sufficient remaining

        validity in the selected IDC may be referenced by a new Build.

        '
      operationId: getTemplateFile
      responses:
        '200':
          description: Current file context state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateFileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /templates/{template_id}/builds:
    parameters:
    - $ref: '#/components/parameters/TemplateBuildTemplateIdPathParam'
    post:
      tags:
      - SandboxTemplate
      summary: Create and start a rebuild
      description: 'Creates a new Build from the given definition and starts it immediately.

        A rebuild inherits the most recent Build''s IDC placement and resources, so a

        Template with no Build records left has nothing to inherit and returns

        409. Not supported in every IDC; IDCs without rebuild support reject it with 422.


        A rebuild supersedes the Template''s still-running Builds: each one is

        finalized as `error` with failure code `TemplateBuild.Superseded`, its

        backing build in the selected IDC is cancelled, and its partial

        artifacts are reclaimed, best-effort. When the new Build turns `ready`

        it becomes the Template''s default Build; the previously bound Build''s

        artifact is then reclaimed where the selected IDC permits it (an

        artifact still referenced by dependent resources is retained and

        reclaimed on Template deletion instead). If the new Build fails, the

        previous binding is unchanged.


        This operation is not idempotent and does not accept an `Idempotency-Key`

        header. Every call creates a new Build and supersedes the running ones, so

        before retrying a request whose outcome is unknown, check

        `GET /templates/{template_id}/builds` for the Build it may already have created.

        '
      operationId: createTemplateBuild
      parameters:
      - $ref: '#/components/parameters/IdcNameQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildDefinition'
      responses:
        '201':
          description: 'The Build record is created and immediately addressable via

            `GET /templates/{template_id}/builds/{id}`; build progress is

            reported by `status`, not by the status code.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateBuildMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'State conflict (`Resource.StateConflict` or an operation-specific code), or the
            selected IDC is under maintenance (`IDC.UnderMaintenance`): write operations are rejected
            until the IDC is usable again. Read operations are unaffected.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/Unsupported'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    get:
      tags:
      - SandboxTemplate
      summary: List Template Builds
      description: Lists immutable Build attempts in reverse chronological order.
      operationId: listTemplateBuilds
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Builds were returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /templates/{template_id}/builds/{id}:
    parameters:
    - $ref: '#/components/parameters/TemplateBuildTemplateIdPathParam'
    - $ref: '#/components/parameters/BuildIdPathParam'
    post:
      tags:
      - SandboxTemplate
      summary: Start an existing Build
      description: 'Starts a Build created by the split create flow (a `waiting` initial

        Build). This is an action on an existing record — nothing new is

        created — so success is a 202 acceptance; poll the Build for the

        outcome. Starting a Build that is not in `waiting` state returns 400 `Parameter.Invalid`. Not

        supported in every IDC; unsupported IDCs reject it with 422.

        '
      operationId: startTemplateBuild
      parameters:
      - $ref: '#/components/parameters/IdcNameQueryParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildDefinition'
      responses:
        '202':
          description: The start instruction was accepted; the Build is now building.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateBuildMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'State conflict (`Resource.StateConflict` or an operation-specific code), or the
            selected IDC is under maintenance (`IDC.UnderMaintenance`): write operations are rejected
            until the IDC is usable again. Read operations are unaffected.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/Unsupported'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    get:
      tags:
      - SandboxTemplate
      summary: Get a Template Build
      description: Returns normalized Build status and artifact availability.
      operationId: getTemplateBuild
      responses:
        '200':
          description: The Build was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateBuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /templates/{template_id}/builds/{id}/logs:
    parameters:
    - $ref: '#/components/parameters/TemplateBuildTemplateIdPathParam'
    - $ref: '#/components/parameters/BuildIdPathParam'
    get:
      tags:
      - SandboxTemplate
      summary: Get live Template Build logs
      description: "Returns live logs for a Template Build; the platform does not persist them.\
        \ \nLogs are filtered and paged server-side across upstream pages, preserving raw log\
        \ offsets.\n"
      operationId: getTemplateBuildLogs
      parameters:
      - name: offset
        in: query
        description: Zero-based raw log entry offset before level filtering. At most 2147483647.
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: limit
        in: query
        description: Maximum number of log entries to return.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: level
        in: query
        description: Optional normalized log level filter.
        schema:
          type: string
          enum:
          - debug
          - info
          - warn
          - error
      responses:
        '200':
          description: Build logs were returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildLogPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
components:
  parameters:
    BuildIdPathParam:
      name: id
      in: path
      required: true
      description: GMI Template Build identifier.
      schema:
        type: string
        format: uuid
    IdcNameQueryParam:
      name: idc_name
      in: query
      description: Filter by data center name, e.g. us-denver-1
      schema:
        type: string
    IdcNameRequiredQueryParam:
      name: idc_name
      in: query
      required: true
      description: IDC identifier used for capability and resource resolution.
      schema:
        type: string
    IdempotencyKeyOptionalParam:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional caller-generated idempotency key (a UUID is recommended).

        Matched byte-for-byte: 1-64 printable ASCII characters, no whitespace.

        Absent means no deduplication. The same key with a different request

        body returns 400 Sandbox.IdempotentParameterMismatch. Echoed on

        responses; replays add Idempotency-Replayed: true. Keys are remembered

        for 24 hours.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 64
    IdempotencyKeyRequiredParam:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Caller-generated key that makes the mutation safe to retry (a UUID is

        recommended). Matched byte-for-byte: 1-64 printable ASCII characters,

        no whitespace. The same key with a different request body returns 400

        Sandbox.IdempotentParameterMismatch. Echoed on responses; replays add

        Idempotency-Replayed: true. Keys are remembered for 24 hours.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 64
    PageParam:
      name: page
      in: query
      description: Page number, starting from 1; default 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      description: Items per page; default 20, maximum 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SandboxExecExecutionIDParam:
      name: execution_id
      in: path
      required: true
      description: Public execution identifier returned by the create operation. A value that is not a valid UUID is treated as an unknown execution and returns 404 `Execution.NotFound`.
      schema:
        type: string
        format: uuid
    SandboxExecRequestIDParam:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Ignored. The server generates its own request ID (`req-<uuid>`) for every request and
        returns it in the `X-Request-ID` response header and the body's `request_id`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SandboxExecWaitParam:
      name: wait
      in: query
      required: false
      description: >-
        Wait for a terminal result before responding. Defaults to false. Must be `true` or `false`; any
        other value returns 400 `Execution.InvalidRequest`.
      schema:
        type: boolean
        default: false
    SandboxExecWaitTimeoutParam:
      name: wait_timeout_seconds
      in: query
      required: false
      description: 'Maximum time to wait when `wait=true`, in seconds. Values from 1 through 25

        are accepted. A wait timeout never cancels the execution.

        Only valid together with `wait=true` (otherwise 400 `Execution.InvalidRequest`); a value outside 1..25 or not an integer returns 400 `Execution.InvalidWaitTimeout`.

        '
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 25
    SandboxExecIdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional key that makes `POST /executions` safe to retry: 1 to 64 printable ASCII characters
        without whitespace. Resubmitting the same key with
        identical parameters returns the same execution in its current state instead of starting a new
        one; the same key with different parameters returns 400 `Execution.IdempotentParameterMismatch`.
        A key that is empty or not 1 to 64 printable ASCII characters returns 400 `Execution.InvalidRequest`.
        The key is remembered for a limited time after the execution reaches a terminal state; after that,
        the same key starts a new execution.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SandboxShellRequestIDParam:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Ignored. The server generates its own request ID (`req-<uuid>`) for every request and
        returns it in the `X-Request-ID` response header and the body's `request_id`.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    SandboxFilePathQueryParam:
      name: path
      in: query
      required: true
      description: '**Absolute path** inside the sandbox. Must start with `/` and be normalized: relative
        segments such as `.` / `..` and `//` are rejected, and a path that points to a directory (for example
        one ending in `/`) returns `400`. No semantic interpretation is applied beyond existence checks; for
        writes, the parent directory must already exist.

        '
      schema:
        type: string
        minLength: 1
      example: /home/user/data.bin
    SandboxFileUsernameQueryParam:
      name: username
      in: query
      required: false
      description: 'Perform the file operation as this user; defaults to the sandbox''s default user.
        **Optional capability**: some data centers ignore this parameter and always act as the default
        user, so do not rely on it for permission isolation.

        '
      schema:
        type: string
      example: user
    SandboxIdPathParam:
      name: id
      in: path
      required: true
      description: Unique sandbox resource ID (UUID; the `id` field of the create response). The data-plane
        key (`sandbox_key`) cannot be used here.
      schema:
        type: string
        format: uuid
      example: 3f6f0d3e-6f0a-4a2e-9c58-0d3e6f0a4a2e
    TemplateBuildTemplateIdPathParam:
      name: template_id
      in: path
      required: true
      description: Owning GMI Template identifier.
      schema:
        type: string
        format: uuid
    TemplateFileIdempotencyKeyRequiredParam:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Caller-generated key that makes Template file initialization safe to

        retry. Matched byte-for-byte: 1-64 printable ASCII characters with no

        whitespace. The key is scoped to the organization and Template and is

        retained with the Template file lifecycle. A different request body

        under the same key returns 400 Sandbox.IdempotentParameterMismatch.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 64
    TemplateIdPathParam:
      name: id
      in: path
      required: true
      description: GMI Template identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: >-
        Invalid request parameters. Two code families are used: `Request.InvalidParameter` for
        request parsing and format validation (unknown or malformed body fields, malformed IDs,
        invalid enum values, out-of-range paging) and `Parameter.Invalid` for business validation
        (for example a template or IDC that cannot be found, or a `timeout` over the limit). Unknown or
        invalid fields inside the `params` of `POST /sandboxes/{id}/actions` are reported as
        `Parameter.Invalid`. Other 400 codes are specific to an operation, for example
        `Sandbox.SourceConflict` (both or neither of `template_id` and `snapshot_id`) and
        `Sandbox.IdempotentParameterMismatch` (an `Idempotency-Key` reused with different parameters).
        Both code families share the same HTTP status, so decide by the `code` value, not the status alone.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: Parameter.Invalid
            message: Invalid request parameters
            request_id: req-xxxx
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: Resource.StateConflict
            message: Resource state conflict
            request_id: req-xxxx
    Forbidden:
      description: The caller cannot access the organization-scoped resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdcUnderMaintenance:
      description: 'The selected IDC is under maintenance. Write operations are rejected until it is

        usable again; read operations are unaffected.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: IDC.UnderMaintenance
            message: IDC us-denver-1 is under maintenance
            request_id: req-xxxx
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: System.Internal
            message: An internal server error occurred
            request_id: req-xxxx
    RequestCanceled:
      description: The caller canceled the current HTTP request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: Request.Canceled
            message: Request canceled
            request_id: req-xxxx
    RequestTimeout:
      description: The current HTTP request exceeded the control-plane processing deadline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: Request.Timeout
            message: Request timed out
            request_id: req-xxxx
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: Resource.NotFound
            message: The requested resource was not found
            request_id: req-xxxx
    UpstreamError:
      description: An upstream Sandbox service is unavailable or returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    QuotaExceeded:
      description: The configured or temporary resource quota would be exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SandboxExecBadRequest:
      description: >-
        Invalid execution request or query parameter. The error code is `Execution.InvalidRequest`
        (invalid body, parameter or header, an unknown query parameter, or a request body over 1 MiB),
        `Execution.InvalidWaitTimeout` (`wait_timeout_seconds` outside 1..25) or
        `Execution.IdempotentParameterMismatch` (the `Idempotency-Key` was already used with different
        parameters).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxExecErrorResponse'
    SandboxExecConflict:
      description: The execution cannot be cancelled in its current state (`Execution.AlreadyCancelled`, `Execution.CancelInProgress` or `Execution.AlreadyCompleted`), or the sandbox is not running (`Execution.RuntimeNotRunning`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxExecErrorResponse'
    SandboxExecRuntimeNotRunning:
      description: >-
        The sandbox is not running, so no command can be executed. The error code is
        `Execution.RuntimeNotRunning`. Start or resume the sandbox and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxExecErrorResponse'
    SandboxExecUnavailable:
      description: >-
        A dependency of the execution service is temporarily unavailable; the request can be retried.
        The error code is `Execution.ProviderUnavailable` (the sandbox backend could not be reached) or
        `Execution.StoreUnavailable` (the execution record could not be read or written).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxExecErrorResponse'
    SandboxExecInternalError:
      description: >-
        The execution service failed to complete the request. The error code identifies the failing step,
        for example `Execution.ResultFailed` when reading an execution's result fails.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxExecErrorResponse'
    SandboxExecNotFound:
      description: Execution does not exist, is not owned by this sandbox, or the identifier is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxExecErrorResponse'
    SandboxExecRateLimited:
      description: >-
        The request was rate-limited. For `POST /executions` the code is
        `Execution.ConcurrencyLimitExceeded`: a sandbox allows at most 10 non-terminal executions at the
        same time; retry after one completes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxExecErrorResponse'
    SandboxExecUnauthorized:
      description: |
        Missing or invalid X-Access-Token. The body is always
        `{"code":"Auth.Unauthorized","message":"unauthorized","request_id":"..."}`; missing, malformed,
        expired, and wrong-sandbox tokens are indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxExecErrorResponse'
          example:
            code: Auth.Unauthorized
            message: unauthorized
            request_id: req-3f2b6c1e-8a0d-4f6b-9c3e-2d7a1b5e9f40
    SandboxShellBadRequest:
      description: |
        Invalid request (`Shell.InvalidRequest`): the body contains unknown or
        extra fields, an unknown `action`, or out-of-bounds values
        (e.g. `cols`/`rows` outside 1..1000).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxShellErrorResponse'
          example:
            code: Shell.InvalidRequest
            message: "request body contains unknown field"
            request_id: "req-7f3c"

    SandboxShellUnauthorized:
      description: |
        Missing or invalid `X-Access-Token`, as on the other data-plane endpoints. The body is always
        `{"code":"Auth.Unauthorized","message":"unauthorized","request_id":"..."}`; missing, malformed,
        expired, and wrong-sandbox tokens are indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxShellErrorResponse'
          example:
            code: Auth.Unauthorized
            message: unauthorized
            request_id: req-3f2b6c1e-8a0d-4f6b-9c3e-2d7a1b5e9f40

    SandboxShellNotFound:
      description: |
        No shell session exists (`Shell.NotFound`): none has been launched yet —
        call `POST /shell` first — or the shell has already been closed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxShellErrorResponse'
          example:
            code: Shell.NotFound
            message: "no shell session for this sandbox"
            request_id: "req-7f3c"

    SandboxFileBadRequest:
      description: '`Parameter.Invalid`: invalid request — `path` is missing or (in some data centers) repeated in the query or sent as a body form field, is not an absolute path,
        is not normalized (contains `.`, `..` or `//`), points to a directory, `username` names a user that does not exist, or the upload is malformed.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
    SandboxFileConflict:
      description: '`Resource.StateConflict`: the sandbox is changing state (for example, resuming), or the
        request conflicts with a concurrent operation on the same file. Retry later.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
    SandboxFileForbidden:
      description: '`Auth.Forbidden`: the token is valid, but file permissions inside the sandbox do not allow the operation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
    SandboxFileInternalError:
      description: '`System.Internal`: data-plane internal error.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
    SandboxFileNotFound:
      description: '`Resource.NotFound`: the target file or its parent directory does not exist, or the sandbox is no longer
        available (deleted/stopped). These cases are likewise not distinguished.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
    SandboxFilePreconditionFailed:
      description: '`Resource.StateConflict`: a conditional request header (such as `If-Match`) does not
        match the file''s current state.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
    SandboxFileRateLimited:
      description: '`RateLimit.Exceeded`: data-plane rate limit hit; back off and retry.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
    SandboxFileUnauthorized:
      description: |
        `Auth.Unauthorized`: `X-Access-Token` is missing, malformed, expired, or does not belong to this sandbox.

        **All of these cases return exactly the same code and message**, so they cannot be told apart.
        This is deliberate: distinguishable errors would let callers use this endpoint as a sandbox-existence
        probe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
          example:
            code: Auth.Unauthorized
            message: unauthorized
            request_id: req-3f2b6c1e-8a0d-4f6b-9c3e-2d7a1b5e9f40
    SandboxFileUpstreamError:
      description: '`System.Internal`: the data plane''s own backend call failed. **This is a server-side problem, not a
        caller credential problem** — re-fetching the token will not help; back off and retry, or report
        it.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxFileError'
    SandboxMutationFailed:
      description: 'A runtime mutation started but was deterministically rejected by the backing infrastructure.
        The top level is the platform''s standard error envelope; `details` additionally carries `state`
        and `last_mutation`, indicating the sandbox is still running while this operation failed.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SandboxMutationErrorResponse'
          example:
            code: Resource.StateConflict
            message: 'Sandbox state conflict: current updating, required running'
            request_id: req-xxxx
            details:
              state: running
              last_mutation:
                type: set_timeout
                status: failed
                error_code: invalid_argument
                message: timeout update rejected by runtime
                completed_at: '2026-08-13T09:12:31Z'
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: Auth.Unauthorized
            message: Authentication required
            request_id: req-xxxx
    UnprocessableEntity:
      description: The request is valid, but the requested capability is not supported in the selected environment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: Template.ProviderNotSupported
            message: The selected IDC does not support this template operation
            request_id: req-xxxx
    Unsupported:
      description: 'The request is valid but the selected IDC does not support

        the requested capability or resolved resource specification.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ArtifactState:
      type: string
      enum:
      - absent
      - unknown
      - available
      - reclaimed
      - retained
      description: 'Build artifact availability independent of Build status.

        `retained` means the Build was logically deleted but the artifact was

        left in place; `reclaimed` means the artifact was hard-deleted.

        '
    TemplateDefaultUser:
      type: object
      additionalProperties: false
      required: [username]
      description: |
        Runtime default identity for Sandboxes launched from this Build.
        Without it, Sandboxes run as `docker run` would: as the Dockerfile's final
        USER, else the image's USER, else root, in the final WORKDIR, else the
        image's, else `/`.
        Sandboxes run commands as a named account: an image USER given as a
        numeric uid (or uid:gid) needs a matching /etc/passwd entry in the image,
        otherwise the Build fails with a reason that names the USER. The group
        part is ignored.
        It is applied after all build commands and overrides the final Dockerfile
        USER at runtime; it does not change the identity of earlier build commands.

        Recommended setup for a custom account: create it in the Dockerfile, give
        it a working directory it can access, and pass its uid, for example
        `RUN useradd --uid 9999 --create-home --shell /bin/bash app`,
        `WORKDIR /home/app`, and `default_user: {username: app, uid: 9999}`.

        - default_user changes the identity only, not the working directory or its
          permissions. If the account cannot enter the final working directory,
          commands cannot start there and the Build may fail; declare an
          accessible WORKDIR to fix it.
        - With uid, the account must already exist with that UID and an existing
          home directory; otherwise the Build fails. The platform does not change
          UID, ownership, groups, or sudo privileges.
        - A non-root username without uid may be rejected with HTTP 422
          (Template.ProviderNotSupported); supply uid to avoid this. root may omit uid.
        - Invalid username, out-of-range uid, or root with a nonzero uid returns
          HTTP 400 (Parameter.Invalid).
        - A Build from a base template keeps the base template's user and working
          directory, as Docker FROM does; set default_user on the child Build to
          select another. Changing it requires a new Build.

        When omitted, the template's default runtime identity is used. A Build
        response reports the requested setting; an omitted uid stays omitted.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[a-z_][a-z0-9_-]{0,31}$'
          example: app
        uid:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: UID of the account. Recommended for non-root usernames. root only accepts 0.
          example: 9999

    BuildDefinition:
      type: object
      additionalProperties: false
      required:
      - source
      properties:
        default_user:
          $ref: '#/components/schemas/TemplateDefaultUser'
        source:
          $ref: '#/components/schemas/BuildSource'
        commands:
          type: array
          maxItems: 100
          description: |
            Shell command strings executed sequentially during the Build. They may
            run as a non-root account with passwordless sudo: prefix privileged
            commands with `sudo`, and set ownership of files that the runtime
            account must use. To control the build identity explicitly, use a
            Dockerfile source with `USER` instructions, as in a regular Dockerfile.
          items:
            type: string
            minLength: 1
            maxLength: 8192
        envs:
          type: object
          maxProperties: 256
          additionalProperties:
            type: string
            maxLength: 32768
          description: 'Environment variables available only during the Template Build.

            They are visible to subsequent build commands/steps and are not persisted

            into the resulting template artifact as sandbox runtime environment

            variables. Pass runtime env when creating a Sandbox instead. Write-only:

            values are never returned on Template or TemplateBuild responses.

            Keys must be unique (JSON object); the server orders them

            deterministically by key. Key names must match

            `[A-Za-z_][A-Za-z0-9_]*`.

            '
        build_timeout_sec:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            Wall-clock budget for this Build in seconds. Omit or null to use the
            platform default (600). Allowed range: 60–3600. On expiry the Build
            is finalized as `error` with failure code `TemplateBuild.TimedOut`,
            its backing build in the selected IDC is cancelled, and its partial
            artifacts are reclaimed, best-effort.
        start_cmd:
          type: string
          minLength: 1
          maxLength: 8192
          description: 'Launch command persisted with the Build and applied when Sandboxes

            created from this Template start.


            It runs as a boot script before the sandbox''s main process, and the

            sandbox only becomes ready once it returns, so the command must

            terminate. A foreground long-running command (`sleep infinity`, a

            server started in the foreground) leaves the Sandbox stuck

            initializing and every exec against it rejected.


            Appending `&` alone is not sufficient: a backgrounded process that

            still holds the inherited stdout/stderr keeps boot blocked just the

            same. Long-running processes must be backgrounded *and* detached

            from those streams, e.g.

            `my-server > /var/log/my-server.log 2>&1 &`.


            Resume continues the saved processes without re-running this command.

            '
        file_context:
          $ref: '#/components/schemas/TemplateFileContext'
    BuildFailure:
      type: object
      nullable: true
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'Stable GMI failure code. Notable values:

            `TemplateBuild.ProviderBuildFailed`, `TemplateBuild.OutOfMemory`,

            `TemplateBuild.OutOfDisk`, `TemplateBuild.TimedOut` (wall-clock

            budget exceeded), `TemplateBuild.Superseded` (replaced by a newer

            rebuild request).

            '
          example: TemplateBuild.OutOfMemory
        message:
          type: string
          description: Sanitized failure message.
    BuildLogEntry:
      type: object
      additionalProperties: false
      required:
      - offset
      - level
      - message
      properties:
        offset:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Zero-based raw log entry offset before level filtering.
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: Log time in UTC when available.
        level:
          type: string
          enum:
          - debug
          - info
          - warn
          - error
          description: Normalized log level.
        message:
          type: string
          description: Sanitized log message.
    BuildLogPage:
      type: object
      additionalProperties: false
      required:
      - entries
      - next_offset
      - has_more
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/BuildLogEntry'
        next_offset:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Raw log offset to use for the next request; advance using this value rather than the number of returned entries. When has_more is false, this remains a valid cursor for polling new logs while the build is running and build logs remain available.
        has_more:
          type: boolean
          description: Whether more matching logs are available or the scan is incomplete. When true, continue using next_offset even if entries is empty.
    BuildLogPageResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: HTTP request correlation identifier.
        data:
          $ref: '#/components/schemas/BuildLogPage'
    BuildPage:
      type: object
      additionalProperties: false
      required:
      - request_id
      - total
      - page
      - page_size
      - items
      properties:
        request_id:
          type: string
          description: HTTP request correlation identifier.
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of Build attempts for the Template.
        page:
          type: integer
          minimum: 1
          description: One-based page number.
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested number of Builds per page.
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateBuild'
    BuildSource:
      oneOf:
      - $ref: '#/components/schemas/ImageSource'
      - $ref: '#/components/schemas/TemplateSource'
      - $ref: '#/components/schemas/DockerfileSource'
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageSource'
          template: '#/components/schemas/TemplateSource'
          dockerfile: '#/components/schemas/DockerfileSource'
      description: Manual Build source. Sandbox sources use the snapshot endpoint.
    BuildSourceType:
      type: string
      enum:
      - image
      - template
      - sandbox
      - dockerfile
      description: Build lineage type.
    BuildStatus:
      type: string
      enum:
      - waiting
      - building
      - ready
      - error
      description: Normalized Template Build status.
    BuildTrigger:
      type: string
      enum:
      - initial_build
      - rebuild
      - snapshot
      description: Operation that created the Build.
    ConnectSandboxControlRequest:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
          description: When greater than 0, extends the lifetime of a running sandbox (extend-only, never
            shortens). The resulting lifetime must not exceed the data center's maximum (default 86400 seconds);
            exceeding it returns 400 `Parameter.Invalid`.
    ConnectSandboxControlResponse:
      type: object
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: Request tracing ID
        data:
          $ref: '#/components/schemas/ConnectSandboxControlResult'
    ConnectSandboxControlResult:
      type: object
      description: 'Same shape as the creation response: identity and data-plane entry point only — no
        template alias, no backing node identifiers, no agent version. Those are backend concepts the
        caller can neither act on nor interpret.

        '
      required:
      - id
      - sandbox_key
      - template_id
      - domain
      - sandbox_access_token
      - traffic_access_token
      - end_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique sandbox resource ID (UUID), used both in control-plane path parameters and
            as the billing resource_id.
        sandbox_key:
          type: string
          description: 'Data-plane addressing key (an `i` followed by a 20-character random string). Used
            solely to assemble data-plane URLs: `https://{sandbox_key}.{domain}` and `https://{port}-{sandbox_key}.{domain}`.
            Control-plane endpoints always use `id` and do not accept this field.

            '
        template_id:
          type: string
        domain:
          type: string
          description: 'Sandbox data-plane domain — the host suffix for data-plane endpoints such as `/files`
            (`https://{sandbox_key}.{domain}`).


            Re-read this field and `sandbox_access_token` on every connect; do not reuse values cached
            from a previous create/connect.

            '
        sandbox_access_token:
          type: string
          description: 'Sandbox data-plane access token (always issued). Sent as the `X-Access-Token`
            header on `/files`, Sandbox-Exec, and other data-plane endpoints; the control plane (`/api/v2`)
            does not use it.


            The `sandbox_access_token` stays valid for the entire lifetime of the sandbox. Connect may
            return a new token when it extends the lifetime or repairs drift; always overwrite the local
            cache with this response instead of assuming it equals the previous create/connect value.

            '
        traffic_access_token:
          type: string
          description: 'Traffic token for non-control ports (issued only when secure=true; sent as the
            traffic-access-token header). Empty when secure=false.

            '
        end_at:
          type: string
          format: date-time
          description: 'The authoritative expiry time (UTC) as settled by this connect call. Returned
            whether or not `timeout` was passed: an extension takes effect only when the requested expiry
            is later than the current one (extend-only), and when it does not take effect this is simply
            the unchanged current value — callers cannot derive the effective value from their own request
            parameters.

            '
    SandboxSnapshotStatus:
      type: string
      enum: [creating, ready, error, deleting, delete_failed]

    SandboxSnapshot:
      type: object
      required:
        - snapshot_id
        - idc_name
        - name
        - status
        - source_sandbox_id
        - source_template_id
        - source_build_id
        - vcpu
        - ram_mb
        - disk_size_mb
        - architecture
        - metadata
        - created_at
        - updated_at
      properties:
        snapshot_id:
          type: string
          format: uuid
          description: Stable durable snapshot identifier.
        idc_name:
          type: string
        name:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/SandboxSnapshotStatus'
        source_sandbox_id:
          type: string
          format: uuid
        source_template_id:
          type: string
          format: uuid
        source_build_id:
          type: string
          format: uuid
        vcpu:
          type: integer
          format: int64
        ram_mb:
          type: integer
          format: int64
        disk_size_mb:
          type: integer
          format: int64
        architecture:
          type: string
        product:
          type: string
          description: Catalog SKU inherited from the source sandbox, when available.
        product_name:
          type: string
          description: Product display name inherited from the source sandbox.
        metadata:
          type: object
          additionalProperties:
            type: string
        failure_code:
          type: string
          description: Stable failure code, present on creation or deletion failure.
        status_reason:
          type: string
          description: Failure detail, present on creation or deletion failure.
        ready_at:
          type: string
          format: date-time
          description: Time the snapshot became ready.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSandboxSnapshotRequest:
      type: object
      required:
        - sandbox_id
      properties:
        sandbox_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
          description: |
            Customer-defined name. Leading and trailing whitespace is removed;
            whitespace-only names become empty.
            Non-empty names are unique within the organization across all IDCs;
            conflicts return 409 Resource.AlreadyExists. Creation failure clears the name.
        metadata:
          type: object
          additionalProperties:
            type: string

    UpdateSandboxSnapshotRequest:
      type: object
      description: Omitted fields remain unchanged. Metadata replaces the entire map.
      properties:
        name:
          type: string
          maxLength: 255
          description: |
            Customer-defined name. Leading and trailing whitespace is removed;
            whitespace-only names become empty.
            Non-empty names are unique within the organization across all IDCs;
            conflicts return 409 Resource.AlreadyExists. Creation failure clears the name. Use an empty string to clear it.
        metadata:
          type: object
          description: Customer-defined key/value pairs. Use an empty object to clear them.
          additionalProperties:
            type: string

    SandboxSnapshotResponse:
      type: object
      required:
        - request_id
        - data
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/SandboxSnapshot'

    ListSandboxSnapshotsResponse:
      type: object
      required:
        - request_id
        - total
        - page
        - page_size
        - items
      properties:
        request_id:
          type: string
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SandboxSnapshot'

    CreateSandboxControlRequest:
      type: object
      additionalProperties: false
      oneOf:
      - required: [template_id]
        not: {required: [snapshot_id]}
      - required: [snapshot_id]
        not: {required: [template_id]}
      properties:
        template_id:
          type: string
          description: >-
            Template identifier or name. Mutually exclusive with snapshot_id: both or neither returns 400
            `Sandbox.SourceConflict`. A template that cannot be found in the effective IDC returns 400
            `Parameter.Invalid`.
        snapshot_id:
          type: string
          format: uuid
          description: >-
            Ready durable snapshot identifier. Mutually exclusive with template_id. Compute resources are
            inherited from the snapshot. A snapshot that does not exist returns 404 `Resource.NotFound`.
        product:
          type: string
          description: >-
            Optional product SKU (see `GET /api/v2/products`, for example `gmi.sandbox.large`). IDCs that
            do not support selecting a product at create time return 422 `Template.ProviderNotSupported`.
          example: gmi.sandbox.large
        idc_name:
          type: string
          description: 'Target data center name, e.g. us-central1-c. Optional: when omitted, the organization''s
            configured default data center is used (maintained by the platform administrator); if the
            organization has no default configured, the request returns 400. If the effective data center is
            under maintenance, the request returns 409 `IDC.UnderMaintenance`. Note that Templates are bound
            to a data center: the effective data center (whether explicit or default) must match the one
            that owns the Template or snapshot referenced by the request, otherwise a Template is reported as not found (400 `Parameter.Invalid`); a snapshot that exists but belongs to another data center also returns 400 `Parameter.Invalid` (404 `Resource.NotFound` is returned only when the snapshot does not exist).

            '
        timeout:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Time-to-live in seconds. When omitted, 300 seconds is used. An explicit value must be at
            least 1; 0 or a negative value returns 400 `Parameter.Invalid`. At most 86400 (24 hours)
            in the selected IDC; a larger value returns 400 `Parameter.Invalid`. The limit can differ by IDC.
        env_vars:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Customer-defined key/value pairs; the platform does not interpret them. The list
            endpoint can filter by them.
        secure:
          type: boolean
          default: false
          description: Enables traffic-access-token authentication on the user endpoint.
        auto_pause:
          type: boolean
          default: false
          description: >-
            When `true`, the sandbox is paused instead of deleted when `timeout` expires (see
            `lifecycle.on_timeout` on the detail endpoint). IDCs that cannot honour this reject the request.
        egress_control:
          type: boolean
          default: false
          description: >-
            Whether to enable dedicated egress control for this sandbox. `false` means public egress;
            `true` starts from deny-all and allows only the `egress`
            allowlist. This switch cannot be changed after creation.
        egress:
          allOf:
          - $ref: '#/components/schemas/SandboxEgressPolicy'
          description: Initial full allowlist when `egress_control` is true; omitted or empty means deny-all.
        default_user:
          allOf:
          - $ref: '#/components/schemas/SandboxDefaultUser'
          description: OS identity for data-plane operations that do not specify a user. Not supported in every IDC.
    CreateSandboxControlResponse:
      type: object
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: Request tracing ID
        data:
          $ref: '#/components/schemas/CreateSandboxControlResult'
    CreateSandboxControlResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique sandbox resource ID (UUID), used both in control-plane path parameters and
            as the billing resource_id.
        sandbox_key:
          type: string
          description: 'Data-plane addressing key (an `i` followed by a 20-character random string). Used
            solely to assemble data-plane URLs: `https://{sandbox_key}.{domain}` and `https://{port}-{sandbox_key}.{domain}`.
            Control-plane endpoints always use `id` and do not accept this field.

            '
        template_id:
          type: string
          description: Template ID
        domain:
          type: string
          description: 'Sandbox data-plane domain. It is the host suffix for data-plane endpoints such
            as `/files` (`https://{sandbox_key}.{domain}`) and for port services (`https://{port}-{sandbox_key}.{domain}`).

            '
        sandbox_access_token:
          type: string
          description: 'Sandbox data-plane access token (always issued). Sent as the `X-Access-Token`
            header on `/files`, Sandbox-Exec, and other data-plane endpoints; the control plane (`/api/v2`)
            does not use it.


            The token returned by create stays valid for the entire lifetime of the sandbox. If the lifetime
            is later extended via connect or `POST .../timeout`, call the connect endpoint to obtain a
            new token.

            '
        traffic_access_token:
          type: string
          description: 'Traffic token for non-control ports (issued only when secure=true; sent as the
            traffic-access-token header). Empty when secure=false.

            '
    CreateTemplateFileRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - content_type
      - sha256
      - size_bytes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum:
          - tar
          - tgz
        sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1073741824
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - resources
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: Organization-scoped Template display name.
        description:
          type: string
          maxLength: 256
          description: Human-readable Template description.
        idc_name:
          type: string
          description: 'IDC that permanently owns the Template. Optional: omitted, empty, and whitespace-only
            values are equivalent — the organization''s configured default data center is used (maintained
            by the platform administrator; the same setting used by sandbox creation). If the organization
            has no default configured, the request returns 400. If the effective data center is under
            maintenance, the request returns 409 `IDC.UnderMaintenance`.

            '
        resources:
          $ref: '#/components/schemas/ResourceSelection'
        labels:
          type: object
          maxProperties: 64
          description: User-defined labels used for filtering.
          additionalProperties:
            type: string
            maxLength: 256
        build:
          allOf:
          - $ref: '#/components/schemas/InitialBuildDefinition'
          description: 'Initial Build definition created and started with the Template

            (combined flow, every IDC supports it). A `file_context` cannot be

            attached here; use the split flow when files are required. Omitting

            `build` selects the split flow: the Template and a `waiting`

            initial Build are created without starting anything, and the Build

            is started later via `POST /templates/{template_id}/builds/{id}`.

            The split flow is not supported in every IDC; unsupported IDCs

            reject it with 422.

            '
    DockerfileSource:
      type: object
      additionalProperties: false
      required:
      - type
      - dockerfile
      properties:
        type:
          type: string
          enum:
          - dockerfile
        dockerfile:
          type: string
          minLength: 1
          maxLength: 262144
          description: 'Raw Dockerfile text. Supported instructions: FROM (exactly one; no

            multi-stage), RUN, ENV, WORKDIR, USER, COPY/ADD, CMD/ENTRYPOINT;

            EXPOSE and VOLUME are skipped; anything else is rejected with 400.


            A trailing backslash continues an instruction on the next line; blank

            and comment lines inside a continuation are skipped.


            The Dockerfile''s final USER is the runtime identity of Sandboxes unless

            `default_user` is set. A Build fails when that account cannot enter the

            final working directory; declare an accessible WORKDIR.


            COPY/ADD sources must reference an uploaded Template file as

            `COPY {{file:<file_id>}} /dest` — local paths and URLs are

            rejected, and at most one file may be referenced per build (its

            `file_id` must also be attached via `file_context`, with

            `file_context.destination` omitted).


            With a dockerfile source, the sibling `commands` and `envs` fields

            are forbidden: write RUN/ENV lines in the Dockerfile instead.

            CMD/ENTRYPOINT are extracted into the Build''s start command; an

            explicit `start_cmd` takes precedence over them.


            ENV values are visible to subsequent build steps and are part of

            the sandbox runtime environment, as under `docker run`; a value

            passed as `env_vars` when creating a Sandbox overrides one of the

            same name. Do not put build-time secrets in ENV: build the Template

            from an image or template source and pass them in `envs`, which

            reach the build steps only.

            '
    EffectiveResources:
      type: object
      additionalProperties: false
      required:
      - cpu_count
      - memory_mb
      - disk_size_mb
      - architecture
      properties:
        cpu_count:
          type: integer
          minimum: 1
          description: Effective integer vCPU count, as configured on the selected preset.
        memory_mb:
          type: integer
          minimum: 1
          description: Effective memory size in MiB, as configured on the selected preset.
        disk_size_mb:
          type: integer
          minimum: 1
          description: Effective boot disk size in MiB, as configured on the selected preset.
        architecture:
          type: string
          enum:
          - x86_64
          - arm64
          description: 'CPU architecture resolved for the selected IDC.

            '
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          description: Machine-readable business error code
          example: Resource.QuotaExceeded
        message:
          type: string
          description: Human-readable error description
          example: The resource quota is not enough.
        request_id:
          type: string
          description: Tracing ID
          example: req-xxxx
        trace_id:
          type: string
          description: Server-side trace identifier for this request; quote it when reporting a problem.
        details:
          type: object
          description: Field-level error details
          additionalProperties: true
    ImageSource:
      type: object
      additionalProperties: false
      required:
      - type
      - image
      properties:
        type:
          type: string
          enum:
          - image
        image:
          type: string
          minLength: 1
          description: 'OCI container image reference. The following distributions have

            been validated: Debian/Ubuntu, Fedora/CentOS Stream/Rocky Linux/

            AlmaLinux, Arch Linux, and Alpine Linux.

            '
        registry_credential:
          $ref: '#/components/schemas/GeneralRegistryCredential'
    GeneralRegistryCredential:
      type: object
      additionalProperties: false
      required:
      - type
      - username
      - password
      description: >-
        A one-time registry credential used to pull the private image named by `image`. `username` and
        `password` are used only for this build request: they are never persisted and never returned in
        any response. The Build detail's `registry_authentication` reports only whether a credential was
        used and of what kind, never the username or password.
      properties:
        type:
          type: string
          enum:
          - general
        username:
          type: string
        password:
          type: string
          description: Can be a password or an access token.
    InitialBuildDefinition:
      type: object
      additionalProperties: false
      required:
      - source
      description: 'Initial Build definition used only by the combined Template-create

        flow. A file context cannot be attached until the Template has a stable

        ID; use the split create/upload/start flow when files are required.

        '
      properties:
        default_user:
          $ref: '#/components/schemas/TemplateDefaultUser'
        source:
          $ref: '#/components/schemas/BuildSource'
        commands:
          type: array
          maxItems: 100
          description: |
            Shell command strings executed sequentially during the Build. They may
            run as a non-root account with passwordless sudo: prefix privileged
            commands with `sudo`, and set ownership of files that the runtime
            account must use. To control the build identity explicitly, use a
            Dockerfile source with `USER` instructions, as in a regular Dockerfile.
          items:
            type: string
            minLength: 1
            maxLength: 8192
        envs:
          type: object
          maxProperties: 256
          additionalProperties:
            type: string
            maxLength: 32768
          description: Build-only environment variables; values are write-only.
        build_timeout_sec:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            Wall-clock budget for this Build in seconds. Omit or null to use the
            platform default (600). Allowed range: 60–3600. On expiry the Build
            is finalized as `error` with failure code `TemplateBuild.TimedOut`,
            its backing build in the selected IDC is cancelled, and its partial
            artifacts are reclaimed, best-effort.
        start_cmd:
          type: string
          minLength: 1
          maxLength: 8192
          description: Launch command applied when Sandboxes from this Template start.
    ListSandboxesControlResponse:
      type: object
      required:
      - request_id
      - total
      - page
      - page_size
      - items
