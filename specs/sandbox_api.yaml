# Sandbox subset of the business-service API spec (docs/openapi.yaml), maintained by hand in this repo.
# When the source spec changes, re-derive this file from the sandbox-tagged operations and keep it in sync,
# but strip internal implementation references
# that are fine in the internal contract but do not belong in customer-facing docs.
openapi: 3.0.3
info:
  title: GMI Sandbox API
  description: 'REST API for GMI Sandbox: create isolated execution environments from templates or durable snapshots, manage
    their lifecycle on the control plane, and run commands or transfer files through each sandbox''s own
    data plane.'
  contact:
    name: GMI Cloud Support
    email: support@gmicloud.ai
  version: '2.0'
servers:
- url: https://console.gmicloud.ai/api/v2
  description: Control plane
tags:
- name: Sandbox
  description: 'Sandbox instance lifecycle management (Sandbox v2, /api/v2/sandboxes)

    '
- name: SandboxSnapshot
  description: Durable sandbox snapshot management (Sandbox v2, `/api/v2/snapshots`)
- name: SandboxTemplate
  description: Sandbox template management (Sandbox v2, `/api/v2/templates`)
- name: Sandbox-Exec
  description: 'Sandbox execution data plane (accessed via the sandbox host and sandbox access token).
    These endpoints are not under the control plane''s `/api/v2` path; clients connect directly to `https://{sandbox_key}.{domain}`
    and authenticate with `X-Access-Token`.

    '
- name: Sandbox-Shell
  description: 'Sandbox interactive terminal (PTY) data plane. **These endpoints are not under `/api/v2`**:
    clients connect directly to `https://{sandbox_key}.{domain}` and authenticate with `X-Access-Token`.
    `{sandbox_key}`, `{domain}` and the `X-Access-Token` value are the `sandbox_key`, `domain` and `sandbox_access_token`
    returned by the control-plane create/connect endpoints; no extra endpoint is needed.


    Each sandbox has exactly **one logical shell session** and at most **one active WebSocket connection**
    at a time (a second concurrent attach is refused at handshake with `409`). Disconnecting does not
    destroy the shell — re-attaching resumes the same session; only `POST /shell/control` with `action=close`
    destroys it.

    '
- name: Sandbox-Files
  description: 'Sandbox file data plane (`/files`). **These endpoints are not under `/api/v2`** and do
    not use `Authorization: Bearer`: they are served by the sandbox''s own data-plane entry point — clients
    connect directly to `https://{sandbox_key}.{domain}` and authenticate with `X-Access-Token`. `{sandbox_key}`
    is the `sandbox_key` returned by the create/connect endpoints, used for data-plane host addressing.
    `{domain}` and `X-Access-Token` are the `domain` and `sandbox_access_token` from the same responses
    — no extra endpoint is needed to obtain them.


    This split is not historical baggage but the nature of a data plane: file transfer is long-lived,
    high-volume, and addressed per sandbox, differing from the control plane''s short requests in both
    capacity model and failure domain, so they do not share an entry point.


    **One unified abstraction.** The same contract is served by two backend kinds (an in-sandbox file
    service / a data-center data-plane proxy); clients need not — and cannot — tell them apart. The cost
    is that the contract is their intersection: `Content-Length` on download and resumable download (`Range`/`206`)
    are **optional capabilities** that vary by data center, and clients must work correctly when they
    are absent. See the per-operation notes below.

    '
security:
- bearerAuth: []
paths:
  /sandboxes:
    post:
      tags:
      - Sandbox
      summary: Create a sandbox
      description: 'Creates a sandbox from exactly one source: `template_id` or a ready `snapshot_id`.


        Compute resources (CPU / memory / disk / architecture) are inherited from the snapshot of the
        selected Template Build or durable snapshot. They are fixed at capture time.
        A snapshot launch is a cold start with a new sandbox identifier; network and lifecycle settings
        come from this create request.

        Snapshot launches return 409 `Snapshot.NotReady` if the snapshot is not ready
        or becomes unavailable for launch before creation is accepted. If snapshot
        launches are unsupported for the selected sandbox configuration, the request
        returns 422 `Snapshot.UnsupportedOnProvider`.


        Idempotency: pass an explicit `Idempotency-Key` request header as the idempotency key (unrelated
        to the tracing header `X-Request-ID`, which is always generated server-side; a client-supplied
        value is ignored). Resubmitting the same key with identical parameters returns the sandbox created
        by the first request (with its current access data) plus an `Idempotency-Replayed: true` response
        header. The same key with different parameters returns 400 `Sandbox.IdempotentParameterMismatch`.
        If the creation under that key has deterministically failed, or the sandbox it created has been
        deleted, the request returns 409 `Sandbox.IdempotentKeyConsumed` (retryable failures are automatically
        re-attempted when the same key is retried). The deduplication window is 24 hours; after it expires
        the same key is treated as a new request. Without the header, no deduplication is performed.


        Backends that create asynchronously return as soon as the request is accepted: the instance starts
        in `provisioning` and transitions to `running` once ready. The detail endpoint is queryable during
        this period (see GET /sandboxes/{id}).


        **The `sandbox_access_token` stays valid for the entire lifetime of the sandbox.**

        '
      operationId: createSandbox
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOptionalParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxControlRequest'
      responses:
        '201':
          description: Sandbox created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSandboxControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'State conflict (`Resource.StateConflict` or an operation-specific code), or the
            selected IDC is under maintenance (`IDC.UnderMaintenance`): write operations are rejected
            until the IDC is usable again. Read operations are unaffected.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          description: |
            Capacity or concurrency limit reached. `Resource.QuotaExceeded` means a live quota (instances /
            instance_type / vcpu) is exhausted and needs a quota change; `details` carries resource_type /
            idc_name / quota_name / quota_value / quota / used / requested. `RateLimit.Exceeded` has two sources:
            the organization already has its maximum number of sandboxes being created in this IDC
            (`details.quota_name` = `concurrent_creates`, same `details` shape, and a `Retry-After` header in
            seconds: wait that long and retry), or the platform is temporarily at its capacity for starting sandboxes (no `details`,
            no `Retry-After`: retry shortly). Tell them apart by `details.quota_name` or `Retry-After`.
          headers:
            Retry-After:
              description: Only on the concurrent-create limit (details.quota_name = concurrent_creates); suggested wait before retrying, in seconds.
              schema: { type: integer, example: 2 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    get:
      tags:
      - Sandbox
      summary: List active sandboxes
      description: 'Returns sandboxes that are still actionable or still worth watching: `provisioning`,
        `running`, `updating`, `checkpointing`, `pausing`, `paused`, `resuming`, plus the terminal failure
        state `failed`. Instances in transitional states do not disappear from the list while an operation
        is in flight, and a paused instance stays visible for its whole retention window (`paused_expire_at`).
        Results are ordered by `started_at` descending; pagination is applied after filtering.


        The `state` filter takes external states; the server maps them back to internal ones. `running`
        also matches instances in short-lived lease states (`updating` / `checkpointing`), because those
        mean "running but briefly busy" rather than a separately actionable state.

        '
      operationId: listSandboxes
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/IdcNameQueryParam'
      - name: state
        in: query
        description: >-
          Filter by external state. Repeatable; multiple values are OR-ed. When omitted, all active
          instances and `failed` ones are returned; `deleted` records are returned only when
          requested explicitly. `deleting` is not an accepted filter value.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - provisioning
            - running
            - pausing
            - paused
            - resuming
            - failed
            - deleted
      - name: metadata[key]
        in: query
        description: 'Filter by customer metadata key/value, e.g. `metadata[job_id]=job-9182`. Repeatable;
          multiple filters are AND-ed.

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Query succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSandboxesControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /executions:
    servers:
    - url: https://{sandbox_key}.{domain}
      description: 'Sandbox data-plane entry point. Both variables come from the create/connect response:
        `sandbox_key` is `data.sandbox_key`, `domain` is `data.domain`.

        '
      variables:
        sandbox_key:
          default: sandbox-key
          description: Sandbox key (the `sandbox_key` returned by the create/connect endpoints)
        domain:
          default: sandbox.example.com
          description: 'The `domain` returned verbatim by the create/connect endpoints. Its default naming
            shape is `{idc-name}.{root-hostname}`, but clients must not assemble or derive it themselves.

            '
    post:
      tags:
      - Sandbox-Exec
      summary: Execute a command in a sandbox
      description: 'Starts an asynchronous shell execution in the sandbox. The request body keeps the

        `action=exec` and `parameters` shape used by the runtime contract. The effective URL is

        the sandbox data-plane host; the sandbox ID is obtained from the leftmost Host label and

        is not repeated in the path. The endpoint does not include the control-plane `/api/v2` prefix.

        When `wait=true`, the server waits for a terminal result for at most

        `wait_timeout_seconds` seconds; a timeout returns `202` without cancelling the execution.

        Cancelling an execution, or reaching its timeout, stops the command and every process it
        started: all processes in the command''s process group receive SIGTERM and then SIGKILL, so a
        pipeline or `bash -c "a; b"` leaves nothing behind. A process that deliberately leaves the group
        (for example with `setsid`) is not stopped. A command that exits on its own does not stop the
        background processes it started, so a server started with `nohup app > app.log 2>&1 &` keeps
        running; redirect the output of such a process, because the execution only ends once the
        command''s stdout and stderr are closed. Pausing the sandbox does not end the execution; the
        time spent paused still counts toward the execution''s timeout.

        The request body is limited to 1 MiB. Unknown query parameters are rejected with 400. A sandbox allows at most 10 non-terminal executions at the same time; further requests return 429 `Execution.ConcurrencyLimitExceeded` until one completes.

        '
      operationId: createSandboxExecution
      servers:
      - url: https://{sandbox_key}.{domain}
        description: Sandbox data-plane host
        variables:
          sandbox_key:
            default: sandbox-key
            description: Data-plane addressing key (`sandbox_key` from the control-plane response).
          domain:
            default: sandbox.example.com
            description: Sandbox data-plane domain from the control-plane response.
      security:
      - sandboxAccessToken: []
      parameters:
      - $ref: '#/components/parameters/SandboxExecRequestIDParam'
      - $ref: '#/components/parameters/SandboxExecWaitParam'
      - $ref: '#/components/parameters/SandboxExecWaitTimeoutParam'
      - $ref: '#/components/parameters/SandboxExecIdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxExecRequest'
            example:
              action: exec
              parameters:
                command: printf '%s\n' "$APP_ENV"
                envs:
                  APP_ENV: production
                cwd: /workspace
      responses:
        '200':
          description: Execution completed within the requested wait window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxExecResultResponse'
        '202':
          description: Execution accepted, or still running when the wait window expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxExecAcceptedResponse'
        '400':
          $ref: '#/components/responses/SandboxExecBadRequest'
        '401':
          $ref: '#/components/responses/SandboxExecUnauthorized'
        '409':
          $ref: '#/components/responses/SandboxExecRuntimeNotRunning'
        '429':
          $ref: '#/components/responses/SandboxExecRateLimited'
        '503':
          $ref: '#/components/responses/SandboxExecUnavailable'
        '500':
          $ref: '#/components/responses/SandboxExecInternalError'
  /executions/{execution_id}:
    servers:
    - url: https://{sandbox_key}.{domain}
      description: 'Sandbox data-plane entry point. Both variables come from the create/connect response:
        `sandbox_key` is `data.sandbox_key`, `domain` is `data.domain`.

        '
      variables:
        sandbox_key:
          default: sandbox-key
          description: Sandbox key (the `sandbox_key` returned by the create/connect endpoints)
        domain:
          default: sandbox.example.com
          description: 'The `domain` returned verbatim by the create/connect endpoints. Its default naming
            shape is `{idc-name}.{root-hostname}`, but clients must not assemble or derive it themselves.

            '
    get:
      tags:
      - Sandbox-Exec
      summary: Get a sandbox execution
      operationId: getSandboxExecution
      servers:
      - url: https://{sandbox_key}.{domain}
        description: Sandbox data-plane host
        variables:
          sandbox_key:
            default: sandbox-key
            description: Data-plane addressing key (`sandbox_key` from the control-plane response).
          domain:
            default: sandbox.example.com
            description: Sandbox data-plane domain from the control-plane response.
      security:
      - sandboxAccessToken: []
      parameters:
      - $ref: '#/components/parameters/SandboxExecExecutionIDParam'
      - $ref: '#/components/parameters/SandboxExecRequestIDParam'
      responses:
        '200':
          description: Current execution status and any available output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxExecResultResponse'
        '401':
          $ref: '#/components/responses/SandboxExecUnauthorized'
        '404':
          $ref: '#/components/responses/SandboxExecNotFound'
        '409':
          $ref: '#/components/responses/SandboxExecRuntimeNotRunning'
        '429':
          $ref: '#/components/responses/SandboxExecRateLimited'
        '503':
          $ref: '#/components/responses/SandboxExecUnavailable'
        '500':
          $ref: '#/components/responses/SandboxExecInternalError'
  /executions/{execution_id}/cancel:
    servers:
    - url: https://{sandbox_key}.{domain}
      description: 'Sandbox data-plane entry point. Both variables come from the create/connect response:
        `sandbox_key` is `data.sandbox_key`, `domain` is `data.domain`.

        '
      variables:
        sandbox_key:
          default: sandbox-key
          description: Sandbox key (the `sandbox_key` returned by the create/connect endpoints)
        domain:
          default: sandbox.example.com
          description: 'The `domain` returned verbatim by the create/connect endpoints. Its default naming
            shape is `{idc-name}.{root-hostname}`, but clients must not assemble or derive it themselves.

            '
    post:
      tags:
      - Sandbox-Exec
      summary: Cancel a sandbox execution
      description: 'Requests cancellation of a non-terminal execution. The call returns `202` once cancellation is accepted; the execution then moves to `cancelling` and
        finally `cancelled`. Cancellation is not idempotent: cancelling an execution that is already
        cancelled, being cancelled, or finished returns `409` (`Execution.AlreadyCancelled`,
        `Execution.CancelInProgress` or `Execution.AlreadyCompleted`).


        The request must have an empty body; any non-empty body returns 400 `Execution.InvalidRequest`.

        '
      operationId: cancelSandboxExecution
      servers:
      - url: https://{sandbox_key}.{domain}
        description: Sandbox data-plane host
        variables:
          sandbox_key:
            default: sandbox-key
            description: Data-plane addressing key (`sandbox_key` from the control-plane response).
          domain:
            default: sandbox.example.com
            description: Sandbox data-plane domain from the control-plane response.
      security:
      - sandboxAccessToken: []
      parameters:
      - $ref: '#/components/parameters/SandboxExecExecutionIDParam'
      - $ref: '#/components/parameters/SandboxExecRequestIDParam'
      responses:
        '202':
          description: Cancellation accepted and is being processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxExecAcceptedResponse'
        '400':
          description: >-
            The request carries a body. This endpoint takes none: any non-empty request body, whatever its `Content-Type`, is rejected with `Execution.InvalidRequest`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxExecErrorResponse'
        '401':
          $ref: '#/components/responses/SandboxExecUnauthorized'
        '404':
          $ref: '#/components/responses/SandboxExecNotFound'
        '409':
          $ref: '#/components/responses/SandboxExecConflict'
        '429':
          $ref: '#/components/responses/SandboxExecRateLimited'
        '503':
          $ref: '#/components/responses/SandboxExecUnavailable'
        '500':
          $ref: '#/components/responses/SandboxExecInternalError'
  /shell:
    post:
      tags:
        - Sandbox-Shell
      summary: Launch the sandbox interactive shell
      description: |
        Ensures the sandbox's single logical shell (PTY) session exists. The call is
        idempotent: if the shell already exists, it returns `200` with the current
        status instead of creating a duplicate. The effective URL is the sandbox
        data-plane host (`https://{sandbox_key}.{domain}`; both values, like the
        `X-Access-Token` value, come from the control-plane create/connect response).
        The endpoint does not include the control-plane `/api/v2` prefix.

        The request body must be empty or `{}`; unknown fields are rejected with
        `400 Shell.InvalidRequest`.

        On `200`, `connect_url` is the **relative** path of the WebSocket attach
        endpoint. The full attach address is
        `wss://{sandbox_key}.{domain}{connect_url}` — the same host this request was
        sent to, with the scheme switched to `wss`.

        A `202` with `code=Shell.Creating` means another request is currently
        creating the shell; retry `POST /shell` shortly — the retry never creates a
        duplicate PTY.
      operationId: launchSandboxShell
      servers:
        - url: https://{sandbox_key}.{domain}
          description: Sandbox data-plane host
          variables:
            sandbox_key:
              default: sandbox-key
              description: Data-plane addressing key (`sandbox_key` from the control-plane response).
            domain:
              default: sandbox.example.com
              description: Sandbox data-plane domain from the control-plane response.
      security:
        - sandboxAccessToken: []
      parameters:
        - $ref: '#/components/parameters/SandboxShellRequestIDParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: |
                Empty object. Any unknown field is rejected with `400 Shell.InvalidRequest`.
            example: {}
      responses:
        '200':
          description: |
            The shell exists (created by this call, or already present).
            `status=ready` means the PTY exists and can be attached;
            `status=attached` means the shell exists **and** currently has an
            active WebSocket connection (a second attach would get `409`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellLaunchResponse'
              example:
                request_id: "req-7f3c"
                sandbox_key: "sandbox-key"
                status: ready
                connect_url: /shell/connect
        '202':
          description: |
            Another request is currently creating the shell (`Shell.Creating`).
            Retry `POST /shell` shortly; the launch is idempotent and a retry
            never creates a duplicate PTY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellCreatingResponse'
              example:
                request_id: "req-7f3c"
                sandbox_key: "sandbox-key"
                status: creating
                code: Shell.Creating
        '400':
          $ref: '#/components/responses/SandboxShellBadRequest'
        '401':
          $ref: '#/components/responses/SandboxShellUnauthorized'
        '409':
          description: |
            State conflict, one of:
            - `Shell.RuntimeNotRunning`: the sandbox is not running (for example it is
              paused and cannot be resumed right now, or it is still changing state).
            - `Shell.Closing`: the shell is being torn down; retry `POST /shell` shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
        '502':
          description: |
            `Shell.CreateFailed`: the shell could not be created in the selected IDC.
            Retrying later starts a fresh session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
        '503':
          description: |
            `Shell.ProviderUnavailable` or `Shell.StoreUnavailable`: the shell state could not be
            determined. Safe to retry — a retry never creates a duplicate PTY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
        '500':
          description: |
            `Shell.InternalError`: unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'

  /shell/connect:
    get:
      tags:
        - Sandbox-Shell
      summary: Attach to the sandbox shell (WebSocket)
      description: |
        WebSocket handshake — **not a normal GET**. Code generators produce no
        usable client for this operation (see `x-websocket`); consumers use a
        WebSocket library instead. The address is composed from the `POST /shell`
        response: `wss://{sandbox_key}.{domain}{connect_url}` — the same
        data-plane host, scheme `wss`.

        The client sends the standard upgrade headers (`Upgrade: websocket`,
        `Connection: Upgrade`, plus the `Sec-WebSocket-*` headers WebSocket
        libraries add automatically) together with the same `X-Access-Token`
        used by the other data-plane endpoints. When a browser sends an `Origin`
        header, it must be on the server allowlist, otherwise the handshake is
        refused with `403`.

        After the `101` upgrade the connection switches to WebSocket framing:

        - **BINARY frames only.** client→server frames carry raw terminal input
          bytes; server→client frames carry raw terminal output bytes (ANSI
          escape sequences included, xterm.js-compatible).
        - Text frames are a protocol violation: the server drops the connection.
        - **No JSON messages in-band.** Resize and close go through
          `POST /shell/control`, never over the WebSocket.
        - At most **one active connection per sandbox**; a second concurrent
          attach is refused at handshake time with `409`.
        - Disconnecting keeps the shell alive — reattaching resumes the same
          session. Only `POST /shell/control` with `action=close` destroys it.

        Pre-upgrade errors are returned as plain HTTP responses (see below).
      operationId: attachSandboxShell
      x-websocket: true
      servers:
        - url: https://{sandbox_key}.{domain}
          description: Sandbox data-plane host
          variables:
            sandbox_key:
              default: sandbox-key
              description: Data-plane addressing key (`sandbox_key` from the control-plane response).
            domain:
              default: sandbox.example.com
              description: Sandbox data-plane domain from the control-plane response.
      security:
        - sandboxAccessToken: []
      responses:
        '101':
          description: |
            Handshake succeeded. The connection is now a WebSocket carrying raw
            terminal bytes in BINARY frames; see the operation description for
            the framing protocol. If attaching to the shell fails after the upgrade,
            the server closes the WebSocket with close code `1011` and reason
            `attach failed`.
        '400':
          description: |
            `Shell.InvalidRequest`: required WebSocket upgrade headers
            (`Upgrade: websocket`, `Connection: Upgrade`) are missing or malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
        '401':
          $ref: '#/components/responses/SandboxShellUnauthorized'
        '403':
          description: |
            An `Origin` header was present but is not on the server allowlist
            (browser clients only; non-browser clients normally send no `Origin`). The error code is `Shell.InvalidRequest`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
        '404':
          $ref: '#/components/responses/SandboxShellNotFound'
        '409':
          description: |
            Attach conflict, one of:
            - `Shell.AlreadyAttached`: another WebSocket connection is already
              active (at most one per sandbox).
            - `Shell.Creating`: a launch is still in progress; retry shortly.
            - `Shell.Closing`: the shell is being torn down; launch a new one
              with `POST /shell` afterwards.
            - `Shell.CreateFailed`: the previous launch failed; launch it again with
              `POST /shell`.
            - `Shell.RuntimeNotRunning`: the sandbox is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
              example:
                code: Shell.AlreadyAttached
                message: "shell already has an active connection"
                request_id: "req-7f3c"
        '500':
          description: |
            `Shell.InternalError`: unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
        '503':
          description: |
            Temporarily unavailable, one of `Shell.StoreUnavailable` or
            `Shell.ProviderUnavailable`. Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'

  /shell/control:
    post:
      tags:
        - Sandbox-Shell
      summary: Control the sandbox shell (resize / close)
      description: |
        Out-of-band control channel for the shell. Control commands never travel
        over the WebSocket; this is a plain HTTP call and works from any replica.

        - `action=resize` applies a new terminal size to the live PTY. It
          **requires an active attach** (otherwise `409 Shell.NotAttached`).
        - `action=close` **irrevocably terminates** the shell: the PTY is killed,
          the state is deleted, and any existing WebSocket is severed within
          about one second. The old shell can never be re-attached; the next
          `POST /shell` creates a brand-new session. Close does **not** require
          an active connection.

        Unknown `action` values or extra fields are rejected with
        `400 Shell.InvalidRequest`.
      operationId: controlSandboxShell
      servers:
        - url: https://{sandbox_key}.{domain}
          description: Sandbox data-plane host
          variables:
            sandbox_key:
              default: sandbox-key
              description: Data-plane addressing key (`sandbox_key` from the control-plane response).
            domain:
              default: sandbox.example.com
              description: Sandbox data-plane domain from the control-plane response.
      security:
        - sandboxAccessToken: []
      parameters:
        - $ref: '#/components/parameters/SandboxShellRequestIDParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxShellControlRequest'
            examples:
              resize:
                summary: Resize the terminal
                value:
                  action: resize
                  cols: 120
                  rows: 32
              close:
                summary: Close the shell permanently
                value:
                  action: close
      responses:
        '200':
          description: |
            Control applied. `status=attached` after a successful resize;
            `status=closed` after a successful close.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellControlResponse'
              examples:
                resize:
                  summary: Resize applied
                  value:
                    request_id: "req-7f3c"
                    sandbox_key: "sandbox-key"
                    status: attached
                close:
                  summary: Shell closed
                  value:
                    request_id: "req-7f3c"
                    sandbox_key: "sandbox-key"
                    status: closed
        '400':
          $ref: '#/components/responses/SandboxShellBadRequest'
        '401':
          $ref: '#/components/responses/SandboxShellUnauthorized'
        '404':
          $ref: '#/components/responses/SandboxShellNotFound'
        '409':
          description: |
            State conflict, depending on the action:
            - `Shell.NotAttached` (resize): no active WebSocket connection —
              resize requires one.
            - `Shell.Creating` (close): a launch is still in progress and cannot
              be closed yet; retry shortly.
            - `Shell.Closing` (resize or close): the shell is already being torn down.
            - `Shell.RuntimeNotRunning`: the sandbox is not running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
              example:
                code: Shell.NotAttached
                message: "shell has no active connection"
                request_id: "req-7f3c"
        '502':
          description: |
            Backend call failed, depending on the action:
            - `Shell.ResizeFailed` (resize): the new size could not be applied;
              the shell and connection stay alive, retry is safe.
            - `Shell.CloseFailed` (close): closing on the backend failed **but
              the shell state is already deleted — the shell is still gone**.
              Retrying cannot resurrect it; the next `POST /shell` starts a
              brand-new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
        '503':
          description: |
            Temporarily unavailable, one of `Shell.ProviderUnavailable` or
            `Shell.StoreUnavailable`. For `close` the shell state is kept in the
            closing state, so retrying the close is safe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'
        '500':
          description: |
            `Shell.InternalError`: unexpected server-side failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxShellErrorResponse'

  /sandboxes/{id}:
    get:
      tags:
      - Sandbox
      summary: Get sandbox details
      description: 'Returns sandbox details. Instances in the terminal failure state (`failed`) remain
        readable, with the failure reason in `failure`. Instances being deleted or already deleted (`deleting`
        / `deleted`) also remain readable, with the deleting party and reason in `deletion`, and the response
        carries no `domain`. Expired instances that have not been reclaimed yet return 404.

        '
      operationId: getSandbox
      parameters:
      - $ref: '#/components/parameters/SandboxIdPathParam'
      responses:
        '200':
          description: Query succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxControlDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    patch:
      tags:
      - Sandbox
      summary: Update sandbox metadata
      description: 'Replaces the customer-defined metadata as a whole — no per-key merging; passing an
        empty object clears it. There are no mutable fields other than `metadata`. This operation does
        not take the lifecycle lock, so it works in any state except `deleting` and `deleted`, for which
        it returns 404.

        '
      operationId: updateSandbox
      parameters:
      - $ref: '#/components/parameters/SandboxIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSandboxControlRequest'
      responses:
        '200':
          description: Update succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxControlDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
    delete:
      tags:
      - Sandbox
      summary: Delete (kill) a sandbox
      description: 'Deletes the sandbox. The control plane releases the backing resources synchronously within
        this request: on success the response is **200** with `state` `deleted` (a soft delete; the record
        stays readable). If the release fails or times out the response is **202** with `state` `deleting`:
        the deletion intent is persisted and reconciliation retries until it converges — **there is no force
        parameter**: skipping the release would leave orphaned billable resources. If the deletion intent
        itself cannot be handed off for processing, the call fails with 500 `System.Internal` instead of 202.


        Once the deletion intent is persisted the call is safely replayable: repeating it against a sandbox
        that is being deleted returns 202 (`deleting`), and against an already deleted sandbox it returns
        200 (`deleted`); it never returns 409. Calling it on a sandbox that failed to create (`failed`)
        turns it into `deleted` and returns 200.


        If the sandbox''s IDC is under maintenance the deletion is still accepted: the intent is
        recorded and the sandbox stops being queryable, but the release itself runs once the IDC is
        usable again.

        '
      operationId: deleteSandbox
      parameters:
      - $ref: '#/components/parameters/SandboxIdPathParam'
      responses:
        '200':
          description: The deletion completed within the request (`state` is `deleted`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxDeleteAcceptedResponse'
        '202':
          description: Deletion accepted and being released asynchronously (`state` is `deleting`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxDeleteAcceptedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /sandboxes/{id}/connect:
    post:
      tags:
      - Sandbox
      summary: Connect to a sandbox
      description: 'Connects to a running sandbox and returns its data-plane connection info (domain and
        access token). When `timeout` is provided and greater than 0, the call also extends the sandbox''s
        lifetime (extend-only, never shortens). A paused instance returns 409: waking one up is an
        explicit operation, so call `POST /sandboxes/{id}/resume` first and connect once the state has
        become `running`. A `failed` or deleted instance returns 404 `Resource.NotFound`, and so does an instance that is still
        `provisioning`. An instance in a transitional state (`checkpointing`, `updating`, `pausing`, `resuming`)
        returns 409.


        The response always returns the authoritative expiry time `end_at` as settled by this call — if
        no extension took effect (the requested expiry is not later than the current one), it is simply
        the unchanged current value.


        **The `sandbox_access_token` stays valid for the entire lifetime of the sandbox. When the lifetime
        is extended, the control plane re-signs and returns a new token; even without an extension, if
        the token has drifted from the sandbox''s current `end_at`, this endpoint repairs it.**

        '
      operationId: connectSandbox
      parameters:
      - $ref: '#/components/parameters/SandboxIdPathParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectSandboxControlRequest'
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectSandboxControlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /sandboxes/{id}/pause:
    post:
      tags:
      - Sandbox
      summary: Pause a sandbox
      description: 'Pauses a running sandbox, preserving its ID, disk, memory, and process state.
        Resume continues the saved processes without re-running the template startup command.
        Only a running instance can be paused; any other state returns 409.


        Acceptance returns **202**. The `state` in the response is the state on the row at submission
        time — always `pausing` for a pause — and is **not** the final outcome; poll `GET /sandboxes/{id}`
        until it reports `paused`.


        A pause does not consume runtime: `end_at` is frozen while paused (so it may already be in the
        past) and is shifted forward by the paused duration on resume. A paused instance is instead bounded
        by the retention window `paused_expire_at`, after which the instance and its disk are both reclaimed.

        '
      operationId: pauseSandbox
      parameters:
      - $ref: '#/components/parameters/SandboxIdPathParam'
      responses:
        '202':
          description: Pause accepted; poll the detail endpoint for the settled state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLifecycleAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'State conflict (`Resource.StateConflict` or an operation-specific code), or the
            selected IDC is under maintenance (`IDC.UnderMaintenance`): write operations are rejected
            until the IDC is usable again. Read operations are unaffected.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /sandboxes/{id}/resume:
    post:
      tags:
      - Sandbox
      summary: Resume a paused sandbox
      description: 'Wakes a paused sandbox. This is the **only** way to wake one — `/connect` no longer
        wakes an instance as a side effect. Only a `paused` instance can be resumed; any other state returns
        409.


        Acceptance returns **202**. The `state` in the response is the state on the row at submission time
        (`resuming`, or `running` when the backing infrastructure settles within the request); poll `GET
        /sandboxes/{id}` for the final outcome.


        `timeout` (seconds) defaults to the runtime that was left at the moment of the pause (paused time
        is not counted) when omitted or 0 or less; when provided, it replaces that value. Either way the
        account''s maximum lifetime cap applies, and exceeding it returns 400. A resume re-signs the `sandbox_access_token`
        (its validity is bound to `end_at`), so call `/connect` again for a fresh token once the state
        is `running`.


        If the resume fails the instance returns to `paused` with its files intact and can be retried.
        The one exception is an instance the backing infrastructure reports as gone: the paused data is
        lost with it, the instance moves to reclamation, and polling will show `deleting`.


        Resume restores disk, memory, and process state. Existing processes continue without re-running
        the template startup command. Reconnect network and shell connections after resume; instance
        readiness and endpoint availability are checked separately.

        '
      operationId: resumeSandbox
      parameters:
      - $ref: '#/components/parameters/SandboxIdPathParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeSandboxControlRequest'
      responses:
        '202':
          description: Resume accepted; poll the detail endpoint for the settled state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLifecycleAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'State conflict (`Resource.StateConflict` or an operation-specific code), or the
            selected IDC is under maintenance (`IDC.UnderMaintenance`): write operations are rejected
            until the IDC is usable again. Read operations are unaffected.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /sandboxes/{id}/actions:
    post:
      tags:
      - Sandbox
      summary: Execute a sandbox runtime action
      description: 'Single dispatch endpoint for runtime actions on a running sandbox. Currently
        `update_egress_policy` is supported: it replaces the egress allowlist. Only a sandbox created with
        `egress_control=true` can be updated; the allowlist is a full replacement, not a merge.


        `applied=immediate` means the change is already in effect (existing connections are not promised
        to drop); `applied=eventual` means the change is accepted and still propagating. A sandbox without
        `egress_control` returns 400.


        **Only a `running` sandbox accepts this call.** `paused` and other transitional states return
        409: a paused sandbox has no writable live network, and a resume does not replay a change submitted
        while paused — accepting the call would silently do nothing. Resume the sandbox first with `POST
        /sandboxes/{id}/resume`.

        '
      operationId: executeSandboxAction
      parameters:
      - $ref: '#/components/parameters/SandboxIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteSandboxNetworkActionRequest'
      responses:
        '200':
          description: Action executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSandboxEgressPolicyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SandboxMutationFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/SandboxMutationFailed'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /sandboxes/{id}/timeout:
    post:
      tags:
      - Sandbox
      summary: Set sandbox timeout
      description: 'Resets the time-to-live relative to the current time. When `timeout` is omitted or
        is 0 or less, 300 seconds is used. Only allowed while `running` or `paused`; any other state returns
        409.


        For a `paused` instance, `timeout` means "how long it may run once awake": paused time is not
        counted, so the new `end_at` is measured from the moment of the pause (`paused_at + timeout`),
        not from the current time. This call does not change `paused_expire_at` — how long an instance
        may stay paused and how long it may run are two separate budgets.


        The response returns the expiry time before and after this change: since a `timeout` of 0 or less
        is replaced by the default duration, callers cannot derive the effective value from their own
        request parameters — treat `new_end_at` in the response as authoritative.


        **The `sandbox_access_token` stays valid for the entire lifetime of the sandbox. After extending
        the lifetime, call the connect endpoint again to obtain a new token.**

        '
      operationId: setSandboxTimeout
      parameters:
      - $ref: '#/components/parameters/SandboxIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSandboxControlTimeoutRequest'
      responses:
        '200':
          description: Timeout set; returns the expiry time before and after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetSandboxControlTimeoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The runtime rejected the mutation (see `details.last_mutation`), or the selected IDC
            is under maintenance (`IDC.UnderMaintenance`): write operations are rejected until the IDC is
            usable again.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxMutationErrorResponse'
        '499':
          $ref: '#/components/responses/RequestCanceled'
        '500':
          $ref: '#/components/responses/SandboxMutationFailed'
        '504':
          $ref: '#/components/responses/RequestTimeout'
  /files:
    servers:
    - url: https://{sandbox_key}.{domain}
      description: 'Sandbox data-plane entry point. Both variables come from the create/connect response:
        `sandbox_key` is `data.sandbox_key`, `domain` is `data.domain`.

        '
      variables:
        sandbox_key:
          default: sandbox-key
          description: Sandbox key (the `sandbox_key` returned by the create/connect endpoints)
        domain:
          default: sandbox.example.com
          description: 'The `domain` returned verbatim by the create/connect endpoints. Its default naming
            shape is `{idc-name}.{root-hostname}`, but clients must not assemble or derive it themselves.

            '
    get:
      tags:
      - Sandbox-Files
      summary: Download a sandbox file
      description: 'Reads a single file inside the sandbox by absolute path; the response body is the
        raw byte stream.


        ## Three ways this differs from the rest of the platform


        1. **Not served under `/api/v2`** — see this operation''s `servers`.

        2. **The auth header is `X-Access-Token`** (the `sandbox_access_token` value), not `Authorization:
        Bearer`. Control-plane tokens are invalid here, and vice versa.

        3. **Successful responses are not wrapped in the `{request_id, data}` envelope** (the body is
        a byte stream); errors use the `{code, message, request_id}` error body — see the error notes below.


        ## Optional capabilities: `Content-Length` and resumable downloads


        Both **vary by data center; clients must not assume they exist**:


        | Capability | When supported | When not supported |

        | --- | --- | --- |

        | `Accept-Ranges` | `bytes` | `none` |

        | `Content-Length` | Declares the byte count; enables progress display | Absent; `Transfer-Encoding:
        chunked` |

        | `Range` requests | Returns `206` + `Content-Range` per RFC 7233 | **Returns `200` with the full
        file** |


        **`Accept-Ranges` is the only runtime capability probe**: issue one request without `Range`, or
        read the header on the first response, before deciding whether to resume.


        Data centers without resume support **never fake a `206`**: a request with `Range` gets `200`
        and the entire file. This is deliberate — a client that mistakes the response for a range would
        write bytes at the wrong offset and produce a silently corrupted file, which is far worse than
        an ignored `Range`. The correct resumable-download logic is therefore "resume only when `Accept-Ranges:
        bytes`, otherwise re-download the whole file" — **never** key off any signal other than `206`.


        The server returns no checksum headers (neither backend provides them); clients that need integrity
        verification should compute and compare checksums themselves.

        '
      operationId: downloadSandboxFile
      security:
      - sandboxAccessToken: []
      parameters:
      - $ref: '#/components/parameters/SandboxFilePathQueryParam'
      - $ref: '#/components/parameters/SandboxFileUsernameQueryParam'
      - name: Range
        in: header
        required: false
        description: 'Only honored in data centers with `Accept-Ranges: bytes`; format `bytes=<start>-<end>`.
          Other data centers ignore the header and return `200` + the full file (not `206`).

          '
        schema:
          type: string
        example: bytes=1048576-
      responses:
        '200':
          description: 'The full file. Requests with `Range` also take this branch when the data center
            does not support resuming.

            '
          headers:
            Content-Disposition:
              description: '`inline` or `attachment` (depends on the data center), followed by `filename=<basename>`.
                The filename is quoted when it contains special characters and is sent as `filename*=UTF-8''''...`
                when it is not ASCII.'
              schema:
                type: string
            Accept-Ranges:
              description: '`bytes` (resume supported) or `none` (not supported).'
              schema:
                type: string
                enum:
                - bytes
                - none
            Content-Length:
              description: '**Optional.** Present only in data centers that know the file size up front;
                when absent the response is chunked.

                '
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: '**Optional capability.** Returned only by data centers with `Accept-Ranges: bytes`;
            a request with `Range` may still get `200`, and clients must handle whichever status code
            actually arrives.

            '
          headers:
            Content-Range:
              description: '`bytes <start>-<end>/<total>`'
              schema:
                type: string
            Content-Length:
              description: Byte count of this range
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/SandboxFileBadRequest'
        '401':
          $ref: '#/components/responses/SandboxFileUnauthorized'
        '403':
          $ref: '#/components/responses/SandboxFileForbidden'
        '404':
          $ref: '#/components/responses/SandboxFileNotFound'
        '406':
          description: '`Parameter.Invalid`: the data center cannot serve the file in the requested `Accept-Encoding`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxFileError'
        '409':
          $ref: '#/components/responses/SandboxFileConflict'
        '412':
          $ref: '#/components/responses/SandboxFilePreconditionFailed'
        '416':
          description: '`Parameter.Invalid`. **Optional capability**, returned only by data centers that support resuming:
            the `Range` start is beyond the file length.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxFileError'
        '429':
          $ref: '#/components/responses/SandboxFileRateLimited'
        '500':
          $ref: '#/components/responses/SandboxFileInternalError'
        '502':
          $ref: '#/components/responses/SandboxFileUpstreamError'
    post:
      tags:
      - Sandbox-Files
      summary: Upload a sandbox file
      description: 'Writes one file to the given absolute path inside the sandbox via `multipart/form-data`,
        overwriting any existing file.


        Authentication, host, and the error envelope are identical to the download endpoint (see `GET
        /files`).


        ## Request constraints


        - **The target path is given only in the `path` query parameter; send it exactly once.** A `path`
        form field in the body is ignored or rejected with `400`, depending on the data center. Repeating
        `path` in the query returns `400` in some data centers and uses the first value in others.

        - The request body must be `multipart/form-data`. Some IDCs also accept `multipart/mixed`. In either type the file part must carry `name="file"` in `Content-Disposition`; a part with any other name is ignored and the call still returns `200` with an empty array, so check that the array is not empty. Any other `Content-Type` returns `415`.

        - One file per request.

        - **No chunked/resumable upload.** There is no `Range` semantics for uploads; an interrupted upload
        must be resent in full. A data center may enforce a per-file size limit and return `413` when
        exceeded; the limit is not exposed through the API.

        '
      operationId: uploadSandboxFile
      security:
      - sandboxAccessToken: []
      parameters:
      - $ref: '#/components/parameters/SandboxFilePathQueryParam'
      - $ref: '#/components/parameters/SandboxFileUsernameQueryParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file content.
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        '200':
          description: 'Write complete. The array shape exists for compatibility with existing SDKs; it
            currently always holds a single element.

            '
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxFileEntry'
              example:
              - path: /home/user/data.bin
                name: data.bin
                type: file
        '400':
          $ref: '#/components/responses/SandboxFileBadRequest'
        '401':
          $ref: '#/components/responses/SandboxFileUnauthorized'
        '403':
          $ref: '#/components/responses/SandboxFileForbidden'
        '404':
          $ref: '#/components/responses/SandboxFileNotFound'
        '409':
          $ref: '#/components/responses/SandboxFileConflict'
        '412':
          $ref: '#/components/responses/SandboxFilePreconditionFailed'
        '413':
          description: '`Parameter.Invalid`: the file exceeds the data center''s per-file size limit.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxFileError'
        '415':
          description: '`Parameter.Invalid`: the request body is neither `multipart/form-data` nor a `multipart/mixed` the IDC accepts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxFileError'
        '429':
          $ref: '#/components/responses/SandboxFileRateLimited'
        '500':
          $ref: '#/components/responses/SandboxFileInternalError'
        '502':
          $ref: '#/components/responses/SandboxFileUpstreamError'
        '507':
          description: '`System.Internal`: the sandbox is out of disk space.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxFileError'
  /products:
