            covers every internal non-usable state.

            '
        resources:
          $ref: '#/components/schemas/EffectiveResources'
    ProductCatalogListResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: HTTP request correlation identifier.
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductCatalogItem'
    ResourceSelection:
      allOf:
      - $ref: '#/components/schemas/PresetResourceSelection'
      description: 'Resource values are selected by catalog product SKU

        (`GET /api/v2/products`); the service resolves the active entry from

        the product catalog.

        '
    ResourceSpecName:
      type: string
      enum:
      - X_SMALL
      - SMALL
      - MEDIUM
      - LARGE
      - X_LARGE
      description: Stable human-readable Sandbox resource specification label.
    ResumeSandboxControlRequest:
      type: object
      description: The whole body may be omitted; omitting it keeps the runtime that was left at the moment
        of the pause.
      properties:
        timeout:
          type: integer
          format: int64
          description: 'Time-to-live after the resume, in seconds. When omitted or 0 or less, the runtime
            left at the moment of the pause is kept (paused time is not counted). Subject to the account''s
            maximum lifetime cap; exceeding it returns 400.

            '
    SandboxControlDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique sandbox resource ID (UUID), used both in control-plane path parameters and
            as the billing resource_id.
        sandbox_key:
          type: string
          description: 'Data-plane addressing key (an `i` followed by a 20-character random string). Used
            solely to assemble data-plane URLs: `https://{sandbox_key}.{domain}` and `https://{port}-{sandbox_key}.{domain}`.
            Control-plane endpoints always use `id` and do not accept this field.

            '
        template_id:
          type: string
        snapshot_id:
          type: string
          description: Durable snapshot used to create this sandbox; omitted for template-created sandboxes.
        idc_name:
          type: string
        state:
          $ref: '#/components/schemas/SandboxControlState'
        product:
          type: string
          description: Catalog SKU of the preset the resource was created from.
        product_name:
          type: string
          description: Human-readable label of the preset the resource was created from.
        resources:
          $ref: '#/components/schemas/SandboxResources'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Customer-defined key/value pairs; the platform does not interpret them. The list
            endpoint can filter by them.
        latest_operation:
          $ref: '#/components/schemas/SandboxMutationResult'
        failure:
          $ref: '#/components/schemas/SandboxFailure'
        created_at:
          type: string
          description: Time the request was accepted, UTC
        running_at:
          type: string
          description: Time the instance was confirmed running; empty string while not yet running
        started_at:
          type: string
          description: UTC timestamp, e.g. 2026-08-04T09:12:31.123456789Z
        end_at:
          type: string
          description: 'UTC timestamp; the expiry time of the runtime budget. A pause does not consume
            runtime, so this field is frozen while `paused` (and may therefore already be in the past)
            and is shifted forward by the paused duration on resume. The runtime left on a paused instance
            is `end_at - paused_at`, not `end_at - now`.

            '
        paused_at:
          type: string
          description: 'Time the instance entered `paused` (UTC), and the baseline the runtime budget
            is frozen against. Returned while `paused` and `resuming`; cleared once a resume is confirmed
            `running`.

            '
        paused_expire_at:
          type: string
          description: 'End of the pause retention window (UTC). Returned while `paused` and `resuming`;
            cleared once a resume is confirmed `running`. An instance not resumed by then is reclaimed
            together with its disk. This is a separate budget from `end_at` — this one bounds how long
            an instance may stay paused, `end_at` how long it may run.

            '
        pause:
          type: object
          description: 'Why the instance is paused. Returned while `pausing`, `paused` and `resuming`;
            cleared once a resume is confirmed `running`. A pause you requested and a pause the platform
            applied look the same otherwise; `code` tells them apart, and
            `Sandbox.BillingInsufficientBalance` means the sandbox stays paused until the account is
            topped up and the sandbox is resumed.

            '
          required:
            - code
            - initiator
            - message
            - requested_at
          properties:
            code:
              type: string
              description: '`Sandbox.UserPaused`: paused through `POST /sandboxes/{id}/pause`.
                `Sandbox.BillingInsufficientBalance`: paused by the platform because the account balance
                is insufficient. `Sandbox.Expired`: paused automatically when the runtime budget ran out
                (`lifecycle.on_timeout=pause`).

                '
              example: Sandbox.BillingInsufficientBalance
            initiator:
              type: string
              enum: [user, billing, lifecycle]
            message:
              type: string
              description: Fixed customer-facing text for `code`.
            requested_at:
              type: string
              description: 'When the pause was requested (UTC). Distinct from `paused_at`, which is the
                baseline the runtime budget is frozen against.

                '
        domain:
          type: string
        deletion:
          $ref: '#/components/schemas/SandboxDeletion'
        lifecycle:
          $ref: '#/components/schemas/SandboxControlLifecycle'
        egress_control:
          type: boolean
          description: Whether dedicated egress control was enabled for this sandbox at creation.
        egress:
          $ref: '#/components/schemas/SandboxEgressPolicy'
    SandboxControlDetailResponse:
      type: object
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: Request tracing ID
        data:
          $ref: '#/components/schemas/SandboxControlDetail'
    SandboxControlState:
      type: string
      description: 'External lifecycle state. The internal `creating` state is expressed externally as
        `provisioning` (the instance is being prepared and is not usable yet); backend queueing is not
        expressed separately and is also folded into `provisioning`.


        `deleting` / `deleted`: deletion is a soft delete - once accepted the instance enters `deleting`,
        and after the backing resources are confirmed released it reaches the terminal `deleted` state,
        whose record is kept permanently. In both states the detail endpoint still returns 200 and the
        `deletion` object says who initiated the deletion and why; the data plane returns 404 for them, as do PATCH, connect, pause, resume and
        timeout; `/actions` returns 409, or 400 when the sandbox was created without `egress_control`.
        DELETE can be repeated: it returns 202 while `deleting` and 200 once `deleted`. The default list excludes both states, and `state=deleted`
        returns deleted records explicitly.


        `pausing` / `paused` / `resuming`: pause and resume are an explicit pair of lifecycle operations
        (see `POST /sandboxes/{id}/pause` and `POST /sandboxes/{id}/resume`); both return 202 on acceptance
        and the settled outcome is read back from this field. `pausing` and `resuming` are transitional.
        `paused` means the disk is retained and the instance is no longer running, and no longer consuming
        its runtime budget either (`end_at` is frozen and may already be in the past); it is reclaimed
        at the end of the retention window `paused_expire_at`.

        '
      enum:
      - provisioning
      - running
      - pausing
      - paused
      - resuming
      - checkpointing
      - updating
      - failed
      - deleting
      - deleted
    SandboxDefaultUser:
      type: object
      additionalProperties: false
      required:
      - username
      - uid
      description: >-
        OS identity used by data-plane operations that do not specify a user. Only some IDCs support
        this, and only `{"username":"root","uid":0}` is accepted. An IDC that does not support it returns
        422 `Template.ProviderNotSupported`; any other value returns 400 `Parameter.Invalid`. When omitted,
        the sandbox keeps its default user.
      properties:
        username:
          type: string
          enum:
          - root
        uid:
          type: integer
          format: int64
          minimum: 0
          maximum: 0
    SandboxEgressPolicy:
      type: object
      additionalProperties: false
      properties:
        allowed_hostnames:
          type: array
          items:
            type: string
          description: Allowed hostnames; a leading `*.` wildcard is supported.
        allowed_cidrs:
          type: array
          items:
            type: string
          description: Allowed IPv4 CIDRs.
    SandboxControlLifecycle:
      type: object
      required:
      - auto_resume
      - on_timeout
      properties:
        auto_resume:
          type: boolean
        on_timeout:
          type: string
          enum:
          - pause
          - kill
          description: What happens when the sandbox runtime budget runs out. `pause` pauses the sandbox
            (see `auto_pause` on create); `kill` deletes it.
    SandboxDeletion:
      type: object
      description: >-
        Present only when `state` is `deleting` or `deleted`; explains who initiated the deletion and why.
        `message` is a fixed text for `code`; raw billing or backend error text is never exposed.
      required:
      - code
      - initiator
      - message
      - requested_at
      - completed_at
      properties:
        code:
          type: string
          description: >-
            Deletion reason code. `Sandbox.UserDeleted`: deleted by the user. `Sandbox.BillingInsufficientBalance`,
            `Sandbox.BillingNoPermission`, `Sandbox.BillingProductNotFound`, `Sandbox.BillingOrderCreateFailed`:
            billing order creation failed. `Sandbox.BillingSuspended`: stopped for non-payment.
            `Sandbox.Expired`: reclaimed at expiry. `Sandbox.ProvisionTimedOut`, `Sandbox.ProvisionFailed`:
            creation did not become ready. `Sandbox.ResumeTimedOut`, `Sandbox.PauseFailed`: reclaimed after a
            stuck pause or resume. `Sandbox.ProviderGone`: the backing instance no longer exists.
            `Sandbox.Unknown`: reason not recorded.
          example: Sandbox.UserDeleted
        initiator:
          type: string
          enum:
          - user
          - billing
          - lifecycle
          - system
          description: Who initiated the deletion - the user, billing, the lifecycle (TTL expiry), or the platform.
        message:
          type: string
          description: Fixed user-facing text.
        requested_at:
          type: string
          description: When the deletion intent was accepted (UTC); also the end point of billing metering.
        completed_at:
          type: string
          nullable: true
          description: When the release was confirmed and the sandbox became `deleted` (UTC); null while `deleting`.
    SandboxControlSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique sandbox resource ID (UUID), used both in control-plane path parameters and
            as the billing resource_id.
        sandbox_key:
          type: string
          description: 'Data-plane addressing key (an `i` followed by a 20-character random string). Used
            solely to assemble data-plane URLs: `https://{sandbox_key}.{domain}` and `https://{port}-{sandbox_key}.{domain}`.
            Control-plane endpoints always use `id` and do not accept this field.

            '
        template_id:
          type: string
        snapshot_id:
          type: string
          description: Durable snapshot used to create this sandbox; omitted for template-created sandboxes.
        idc_name:
          type: string
        state:
          $ref: '#/components/schemas/SandboxControlState'
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
        running_at:
          type: string
    SandboxDeleteAcceptedResponse:
      type: object
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            state:
              type: string
              enum:
              - deleted
              - deleting
              description: '`deleted` means the resources were released within this request (returned with
                200); `deleting` means the release continues asynchronously (returned with 202).'
              example: deleted
    SandboxExecAcceptedResponse:
      type: object
      required:
      - request_id
      - execution_id
      - sandbox_id
      - status
      properties:
        request_id:
          type: string
          description: Server-generated request ID (`req-<uuid>`), identical to the `X-Request-ID` response header.
        execution_id:
          type: string
          format: uuid
          description: Public execution identifier.
        sandbox_id:
          type: string
          description: Echo of the data-plane addressing key (i.e. `sandbox_key`; the data plane identifies
            the instance by the key in the host).
        status:
          $ref: '#/components/schemas/SandboxExecStatus'
    SandboxExecErrorResponse:
      type: object
      description: Data-plane error body, in the platform error envelope (without `trace_id`).
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code. A 401 is always `Auth.Unauthorized`.
          example: Execution.InvalidRequest
        message:
          type: string
          description: Sanitized human-readable error message.
        request_id:
          type: string
          description: Server-generated ID for this request (`req-<uuid>`), identical to the `X-Request-ID`
            response header. A caller-supplied `X-Request-ID` is not used.
          example: req-3f2b6c1e-8a0d-4f6b-9c3e-2d7a1b5e9f40
        details:
          type: object
          additionalProperties: true
    SandboxExecRequest:
      type: object
      additionalProperties: false
      required:
      - action
      - parameters
      properties:
        action:
          type: string
          enum:
          - exec
          description: Execution action. The sealed data plane currently supports exec only.
        parameters:
          type: object
          additionalProperties: false
          required:
          - command
          properties:
            command:
              type: string
              minLength: 1
              description: >-
                Shell command to execute. Required and non-empty; at most 128 KiB (counted in bytes) and must not contain NUL. A violation returns 400 `Execution.InvalidRequest`.
            envs:
              type: object
              additionalProperties:
                type: string
              description: >-
                Environment variables for the command. Names must be valid environment variable names (letters,
                digits and underscore, not starting with a digit) of at most 128 bytes, and each value is at
                most 64 KiB; otherwise the request returns 400 `Execution.InvalidRequest`.
            cwd:
              type: string
              description: >-
                Working directory the command runs in (relative paths in the command resolve against it). It must be absolute and normalized: no `.`, `..` or empty segments (a trailing `/` is
                normalized away); otherwise 400 `Execution.InvalidRequest`. When omitted, defaults to the
                template's working directory (the image or Dockerfile WORKDIR; depends on the template and
                IDC, for example `/` or `/home/user`; pass `cwd` explicitly when it matters). If the directory
                does not exist the execution ends with status `failed` and `failure_reason` `cwd_not_found`. If the path exists but is not a directory the execution ends with `failed` and `failure_reason` `cwd_not_directory`.
            execution_timeout_seconds:
              type: integer
              format: int32
              minimum: 1
              maximum: 3600
              default: 300
              description: >-
                Time limit for this command, in seconds. When the limit is reached the command is
                terminated (SIGTERM, then SIGKILL after a grace period) and the execution ends with status `timed_out` and a null `exit_code`.
                A value outside 1..3600 returns 400. This is unrelated to `wait_timeout_seconds`,
                which only bounds how long the request waits for a result. A command stopped this way reports
                `termination_reason` `execution_timeout`.
    SandboxExecResultResponse:
      type: object
      required:
      - request_id
      - execution_id
      - sandbox_id
      - status
      - exit_code
      - stdout
      - stderr
      - stdout_truncated
      - stderr_truncated
      - started_at
      - completed_at
      properties:
        request_id:
          type: string
          description: Server-generated request ID (`req-<uuid>`), identical to the `X-Request-ID` response header.
        execution_id:
          type: string
          format: uuid
        sandbox_id:
          type: string
          description: Echo of the data-plane addressing key (i.e. `sandbox_key`; the data plane identifies
            the instance by the key in the host).
        status:
          $ref: '#/components/schemas/SandboxExecStatus'
        termination_reason:
          type: string
          enum:
          - explicit_cancel
          - execution_timeout
          - runtime_terminated
          description: >-
            Why an execution that did not finish on its own ended. Omitted when the
            command exited by itself, including when it was killed by a signal from
            inside the sandbox (see exit_code). explicit_cancel: the execution was
            cancelled (status cancelled). execution_timeout: the execution reached its
            timeout (status timed_out). runtime_terminated: the command's process is gone
            without having reported an outcome, for example the sandbox was resumed from a
            pause without memory, or its output stream was lost for good, so the outcome of
            the command is unknown (status failed). Pausing a sandbox does not by itself end
            an execution: after a pause with memory the command continues and the execution
            reports its real result.
          example: runtime_terminated
        failure_reason:
          type: string
          enum:
          - cwd_not_found
          - cwd_not_directory
          - permission_denied
          description: >-
            Classified process startup failure. Omitted
            when no recognized startup cause is available. cwd_not_found means
            the working directory does not exist; cwd_not_directory means the
            working directory is not a directory; permission_denied means startup
            was denied without a reliably identified operation. Contains no path
            or raw upstream error. Runtime interruptions use termination_reason.
        exit_code:
          type: integer
          format: int32
          nullable: true
          description: >-
            Exit status of the command. A command killed by a signal (for example an
            out-of-memory kill) reports 128 + signal (137 for SIGKILL) with status failed
            and no termination_reason. Null while non-terminal, and when the execution was
            cancelled, timed out, or its runtime was terminated.
        stdout:
          type: string
          nullable: true
          description: >-
            Captured standard output, or null while not yet available. At most 1 MiB is kept; further output
            is dropped and `stdout_truncated` is true.
        stderr:
          type: string
          nullable: true
          description: >-
            Captured standard error, or null while not yet available. At most 1 MiB is kept; further output
            is dropped and `stderr_truncated` is true.
        stdout_truncated:
          type: boolean
          nullable: true
        stderr_truncated:
          type: boolean
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    SandboxExecStatus:
      type: string
      description: Public lifecycle status of a sandbox execution. `timed_out` means the per-command time limit (`execution_timeout_seconds`) was reached and the command was terminated (SIGTERM, then SIGKILL after a grace period); `exit_code` is then null.
      enum:
      - pending
      - running
      - cancelling
      - succeeded
      - failed
      - cancelled
      - timed_out
    SandboxFailure:
      type: object
      description: Non-empty only when state=failed. The message is sanitized and contains no backend
        identifiers or internal host addresses.
      properties:
        code:
          type: string
          example: Parameter.Invalid
        message:
          type: string
        occurred_at:
          type: string
    SandboxFileEntry:
      type: object
      description: Result entry for a single write.
      required:
      - path
      - name
      - type
      properties:
        path:
          type: string
          description: Absolute path of the file inside the sandbox
          example: /home/user/data.bin
        name:
          type: string
          description: File name (the last segment of `path`)
          example: data.bin
        type:
          type: string
          enum:
          - file
          description: Entry type. Only files are written today, so this is always `file`.
    SandboxShellStatus:
      type: string
      description: |
        Public status of the sandbox shell session.
        - `creating`: a launch is in progress (only appears with `202`).
        - `ready`: the PTY exists and can be attached.
        - `attached`: the shell exists and currently has an active WebSocket
          connection (a second attach would get `409`).
        - `closed`: the shell has been terminated by `action=close` and can
          never be re-attached.
      enum:
        - creating
        - ready
        - attached
        - closed

    SandboxShellLaunchResponse:
      type: object
      required:
        - request_id
        - sandbox_key
        - status
        - connect_url
      properties:
        request_id:
          type: string
          description: Server-generated request ID (`req-<uuid>`), identical to the `X-Request-ID` response header.
        sandbox_key:
          type: string
          description: Echo of the data-plane addressing key (i.e. `sandbox_key`, the leftmost label of the request host).
        status:
          $ref: '#/components/schemas/SandboxShellStatus'
        connect_url:
          type: string
          description: |
            **Relative** path of the WebSocket attach endpoint. The full attach
            address is `wss://{sandbox_key}.{domain}{connect_url}` — the same
            data-plane host this request was sent to, with the scheme switched
            to `wss`. This is always the sandbox's own data-plane endpoint.
          example: /shell/connect

    SandboxShellCreatingResponse:
      type: object
      required:
        - request_id
        - sandbox_key
        - status
        - code
      properties:
        request_id:
          type: string
          description: Server-generated request ID (`req-<uuid>`), identical to the `X-Request-ID` response header.
        sandbox_key:
          type: string
          description: Echo of the data-plane addressing key (i.e. `sandbox_key`, the leftmost label of the request host).
        status:
          type: string
          enum:
            - creating
          description: Always `creating` on this response.
        code:
          type: string
          enum:
            - Shell.Creating
          description: |
            Stable machine-readable hint that another request is currently
            creating the shell. Retry `POST /shell` shortly; the retry never
            creates a duplicate PTY.

    SandboxShellControlRequest:
      type: object
      additionalProperties: false
      required:
        - action
      description: |
        Exactly one control command:
        - `action=resize` requires `cols` and `rows` (each 1..1000) and an
          active WebSocket attach.
        - `action=close` takes no other fields and does not require an active
          connection.
        Unknown `action` values or extra fields are rejected with
        `400 Shell.InvalidRequest`.
      properties:
        action:
          type: string
          enum:
            - resize
            - close
          description: |
            `resize` applies a new terminal size to the live PTY; `close`
            irrevocably terminates the shell (PTY killed, state deleted, any
            existing WebSocket severed within about one second).
        cols:
          type: integer
          minimum: 1
          maximum: 1000
          description: Terminal width in columns. Required when `action=resize`; must be omitted for `close`.
        rows:
          type: integer
          minimum: 1
          maximum: 1000
          description: Terminal height in rows. Required when `action=resize`; must be omitted for `close`.

    SandboxShellControlResponse:
      type: object
      required:
        - request_id
        - sandbox_key
        - status
      properties:
        request_id:
          type: string
          description: Server-generated request ID (`req-<uuid>`), identical to the `X-Request-ID` response header.
        sandbox_key:
          type: string
          description: Echo of the data-plane addressing key (i.e. `sandbox_key`, the leftmost label of the request host).
        status:
          $ref: '#/components/schemas/SandboxShellStatus'

    SandboxShellErrorResponse:
      type: object
      description: Data-plane error body, in the platform error envelope (without `trace_id`).
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          description: Machine-readable error code (`Shell.*`; a 401 is always `Auth.Unauthorized`). The set of codes and their meanings are documented on each response.
          example: Shell.NotFound
        message:
          type: string
          description: Stable, sanitized human-readable error message.
        request_id:
          type: string
          description: Server-generated ID for this request (`req-<uuid>`), identical to the `X-Request-ID`
            response header. A caller-supplied `X-Request-ID` is not used.
          example: req-3f2b6c1e-8a0d-4f6b-9c3e-2d7a1b5e9f40

    SandboxFileError:
      type: object
      description: |
        Data-plane error body, in the platform error envelope (without `trace_id`). Branch on `code`;
        `message` is for humans only — its wording is not a contract and must not be used in program logic.

        `code` uses the platform-wide error codes: `Parameter.Invalid` (400/405/406/413/415/416),
        `Auth.Unauthorized` (401), `Auth.Forbidden` (403), `Resource.NotFound` (404),
        `Resource.StateConflict` (409/412), `RateLimit.Exceeded` (429), and `System.Internal` (5xx).

        `message` is always the server's own wording: raw backend error text may contain internal details
        such as absolute paths inside the sandbox, so it is logged only and never returned.
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: Resource.NotFound
        message:
          type: string
          description: Human-readable error text. Not stable; do not parse.
          example: file not found
        request_id:
          type: string
          description: Server-generated ID for this request (`req-<uuid>`), identical to the `X-Request-ID`
            response header. A caller-supplied `X-Request-ID` is not used.
          example: req-3f2b6c1e-8a0d-4f6b-9c3e-2d7a1b5e9f40
    SandboxLifecycleAcceptedResponse:
      type: object
      description: Shared 202 acceptance body for pause and resume.
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: Request tracing ID
        data:
          type: object
          required:
          - id
          - state
          properties:
            id:
              type: string
              format: uuid
            state:
              type: string
              enum:
              - pausing
              - paused
              - resuming
              - running
              description: 'State on the row at the moment of acceptance, **not** the final outcome: it
                is `pausing` for a pause, and `resuming` (or `running` when the backing infrastructure
                settles within the request) for a resume. Always treat `GET /sandboxes/{id}` as
                authoritative for the settled state.

                '
              example: pausing
    SandboxMutationErrorResponse:
      description: 'Error response for a failed runtime mutation. The top level keeps the platform''s
        standard error envelope (ErrorResponse); the sandbox-specific `state` / `last_mutation` go in
        `details` without altering the top-level structure.

        '
      allOf:
      - $ref: '#/components/schemas/ErrorResponse'
      - type: object
        properties:
          details:
            type: object
            properties:
              state:
                type: string
                description: The sandbox's actual lifecycle state after this operation failed
              last_mutation:
                $ref: '#/components/schemas/SandboxMutationResult'
    ExecuteSandboxNetworkActionRequest:
      type: object
      required:
      - action
      - params
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - update_egress_policy
        params:
          $ref: '#/components/schemas/SandboxEgressPolicy'
    UpdateSandboxEgressPolicyResult:
      type: object
      required:
      - state
      - last_mutation
      - applied
      properties:
        state:
          $ref: '#/components/schemas/SandboxControlState'
        last_mutation:
          $ref: '#/components/schemas/SandboxMutationResult'
        applied:
          type: string
          enum:
          - immediate
          - eventual
          description: >-
            `immediate`: the change is already in effect; existing connections are not promised to drop.
            `eventual`: the change is accepted and still propagating to the running sandbox. Either value
            means the change has been accepted — there is no "saved, takes effect on next resume" outcome;
            a change submitted while paused returns 409 instead.
    UpdateSandboxEgressPolicyResponse:
      type: object
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: Request tracing ID
        data:
          $ref: '#/components/schemas/UpdateSandboxEgressPolicyResult'
    SandboxMutationResult:
      type: object
      description: 'The most recent operation and its outcome. status=pending means the command has been
        accepted but the outcome has not settled yet (asynchronous creation and deletion are in this state
        right after acceptance).

        '
      required:
      - type
      - status
      properties:
        type:
          type: string
          enum:
          - create
          - delete
          - set_timeout
          - update_egress_policy
          - update_ingress_policy
          - rotate_traffic_token
        status:
          type: string
          enum:
          - pending
          - succeeded
          - failed
        error_code:
          type: string
          example: invalid_argument
        message:
          type: string
          description: Sanitized failure reason; never contains access tokens
        completed_at:
          type: string
          format: date-time
    SandboxResources:
      type: object
      description: Compute resources. Fixed when the Template Build is created and snapshotted at sandbox
        creation; immutable afterwards, and the create request cannot override them.
      properties:
        vcpu:
          type: integer
          format: int64
        memory_mb:
          type: integer
          format: int64
        disk_mb:
          type: integer
          format: int64
    SetSandboxControlTimeoutRequest:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
          description: Time-to-live in seconds, measured from the current time. When omitted or 0 or less,
            300 seconds is used. At most the data center's maximum lifetime (default 86400 seconds);
            exceeding it returns 400 `Parameter.Invalid`.
    SetSandboxControlTimeoutResponse:
      type: object
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: Request tracing ID
        data:
          type: object
          required:
          - id
          - old_end_at
          - new_end_at
          properties:
            id:
              type: string
              format: uuid
              description: Unique sandbox resource ID.
            old_end_at:
              type: string
              format: date-time
              description: The expiry time (UTC) before this change.
            new_end_at:
              type: string
              format: date-time
              description: 'The expiry time (UTC) in effect after this change. When a `timeout` of 0 or
                less is replaced by the default duration, this field is authoritative.

                '
    Template:
      type: object
      required:
      - id
      - status
      - name
      - idc_name
      - source_type
      - resources
      - latest_build_id
      - latest_build_status
      - created_at
      - updated_at
      properties:
        status:
          type: string
          enum:
          - creating
          - ready
          - error
          - deleting
          - delete_failed
          - deleted
          description: Resource lifecycle; deletion failures keep references fenced.
        failure_code:
          type: string
          description: Stable deletion failure code; retry DELETE after resolving the cause.
        status_reason:
          type: string
          description: Safe description of the deletion failure.
        id:
          type: string
          description: Immutable GMI Template identifier.
        name:
          type: string
          description: Organization-scoped display name.
        description:
          type: string
          description: Human-readable Template description.
        idc_name:
          type: string
          description: Immutable owning IDC identifier.
        source_type:
          $ref: '#/components/schemas/BuildSourceType'
        image_mirror:
          type: object
          nullable: true
          description: Image mirror configuration of the Template. Always null for new Templates; the platform
            no longer accepts image mirror configuration, so only older Templates may carry a value.
          required:
          - endpoint
          - repository
          - api_key_configured
          properties:
            endpoint:
              type: string
            repository:
              type: string
            api_key_configured:
              type: boolean
              description: Whether an API key is stored. The key itself is never returned.
        product:
          type: string
          nullable: true
          description: Catalog SKU of the preset the Build was created from.
        product_name:
          allOf:
          - $ref: '#/components/schemas/ResourceSpecName'
          nullable: true
          description: Human-readable label of the preset the Build was created from.
        resources:
          $ref: '#/components/schemas/EffectiveResources'
        labels:
          type: object
          additionalProperties:
            type: string
        current_build_id:
          type: string
          nullable: true
          description: Latest successful Build used to create new Sandboxes.
        latest_build_id:
          type: string
          description: Most recently created Build, including a failed Build.
        latest_build_status:
          $ref: '#/components/schemas/BuildStatus'
        rebuildable:
          type: boolean
          description: False for snapshot-created Templates.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Logical deletion time in UTC.
        created_at:
          type: string
          format: date-time
          description: Template creation time in UTC.
        updated_at:
          type: string
          format: date-time
          description: Template update time in UTC.
    TemplateBuild:
      type: object
      required:
      - id
      - template_id
      - trigger
      - status
      - artifact_state
      - source_type
      - resources
      - build_timeout_sec
      - created_at
      properties:
        default_user:
          $ref: '#/components/schemas/TemplateDefaultUser'
        id:
          type: string
          description: Immutable GMI Build identifier.
        template_id:
          type: string
          description: Owning GMI Template identifier.
        trigger:
          $ref: '#/components/schemas/BuildTrigger'
        status:
          $ref: '#/components/schemas/BuildStatus'
        artifact_state:
          $ref: '#/components/schemas/ArtifactState'
        source_type:
          $ref: '#/components/schemas/BuildSourceType'
        source:
          type: object
          description: Sanitized Build lineage. Internal IDs and credentials are omitted.
          additionalProperties: true
        registry_authentication:
          nullable: true
          description: >-
            Whether this Build used a registry credential; non-null only when `registry_credential` was
            supplied at create time. Reports only whether one was used and of what kind, never the
            username or password.
          type: object
          additionalProperties: false
          required:
          - configured
          - type
          properties:
            configured:
              type: boolean
            type:
              type: string
        resources:
          $ref: '#/components/schemas/EffectiveResources'
        product:
          type: string
          nullable: true
          description: Catalog SKU of the preset the Build was created from.
        product_name:
          allOf:
          - $ref: '#/components/schemas/ResourceSpecName'
          nullable: true
          description: Human-readable label of the preset the Build was created from.
        commands:
          type: array
          description: Build command strings. Empty for snapshot Builds.
          items:
            type: string
        start_cmd:
          type: string
          nullable: true
          description: Persisted launch command for this Build.
        ready_cmd:
          type: string
          nullable: true
          description: Readiness check command, unrelated to any registry credential.
        build_timeout_sec:
          type: integer
          minimum: 0
          description: |
            Effective wall-clock budget for this Build (seconds). 0 while the
            Build has not started, or for Builds that predate this field.
        failure:
          $ref: '#/components/schemas/BuildFailure'
        created_at:
          type: string
          format: date-time
          description: Build creation time in UTC.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Build start time in UTC.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Build terminal time in UTC.
    TemplateBuildMutation:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: HTTP request correlation identifier.
        data:
          type: object
          additionalProperties: false
          required:
          - id
          - template_id
          - status
          properties:
            id:
              type: string
              description: The Build this mutation created or started.
            template_id:
              type: string
              description: Owning GMI Template identifier.
            status:
              $ref: '#/components/schemas/BuildStatus'
    TemplateBuildResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: HTTP request correlation identifier.
        data:
          $ref: '#/components/schemas/TemplateBuild'
    TemplateDeletionAccepted:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: Deletion request correlation identifier.
        data:
          type: object
          additionalProperties: false
          required:
          - id
          - status
          properties:
            id:
              type: string
              format: uuid
              description: Template identifier.
            status:
              type: string
              enum:
              - deleting
    TemplateFile:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - state
      - size_bytes
      - sha256
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state:
          type: string
          enum:
          - awaiting_upload
          - verifying
          - importing
          - ready
          - failed
          - expired
        size_bytes:
          type: integer
          format: int64
        sha256:
          type: string
        expires_at:
          type: string
          format: date-time
        failure_code:
          type: string
        status_reason:
          type: string
    TemplateFileContext:
      type: object
      additionalProperties: false
      required:
      - file_id
      properties:
        file_id:
          type: string
          format: uuid
          description: GMI file identifier returned by the upload initialization endpoint.
        destination:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: ^/
          description: 'Absolute destination copied from the archive root during the Build.

            Required for image/template sources; forbidden for a dockerfile

            source, whose `COPY {{file:...}} /dest` lines carry their own

            destinations.

            '
    TemplateFileResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/TemplateFile'
    TemplateFileUpload:
      type: object
      additionalProperties: false
      required:
      - id
      - state
      - status_url
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - awaiting_upload
          - verifying
          - importing
          - ready
          - failed
          - expired
        status_url:
          type: string
        upload:
          type: object
          description: Present only while the file is still awaiting upload.
          additionalProperties: false
          required:
          - method
          - url
          - headers
          - expires_at
          properties:
            method:
              type: string
              enum:
              - PUT
            url:
              type: string
              format: uri
            headers:
              type: object
              additionalProperties:
                type: string
            expires_at:
              type: string
              format: date-time
    TemplateFileUploadResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
        data:
          $ref: '#/components/schemas/TemplateFileUpload'
    TemplateMutationAccepted:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: HTTP request correlation identifier.
        data:
          type: object
          additionalProperties: false
          required:
          - id
          - build_id
          - status
          properties:
            id:
              type: string
              description: Created GMI Template identifier.
            build_id:
              type: string
              description: Created initial or snapshot Build identifier.
            status:
              $ref: '#/components/schemas/BuildStatus'
    TemplatePage:
      type: object
      additionalProperties: false
      required:
      - request_id
      - total
      - page
      - page_size
      - items
      properties:
        request_id:
          type: string
          description: HTTP request correlation identifier.
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total number of matching Templates.
        page:
          type: integer
          minimum: 1
          description: One-based page number.
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested number of Templates per page.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    TemplateResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - data
      properties:
        request_id:
          type: string
          description: HTTP request correlation identifier.
        data:
          $ref: '#/components/schemas/Template'
    TemplateSource:
      type: object
      additionalProperties: false
      required:
      - type
      - template_id
      properties:
        type:
          type: string
          enum:
          - template
        template_id:
          type: string
          description: Parent GMI Template identifier in the same IDC.
        build_id:
          type: string
          description: 'Optional parent Build identifier. When omitted, the parent''s

            current successful Build is used.

            '
    UpdateSandboxControlRequest:
      type: object
      required:
      - metadata
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Customer metadata, replaced as a whole.
    UpdateTemplateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'Template metadata patch. Omitted fields are left unchanged;

        `labels` replaces the stored map wholesale when provided.

        '
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: New organization-scoped display name.
        description:
          type: string
          maxLength: 256
          description: New human-readable description.
        labels:
          type: object
          maxProperties: 64
          description: Complete replacement of user-defined labels.
          additionalProperties:
            type: string
            maxLength: 256
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API Key or Access Token, always sent as `Authorization: Bearer <token>`. The gateway
        recognizes the token type automatically.

        '
    sandboxAccessToken:
      type: apiKey
      in: header
      name: X-Access-Token
      description: 'Sandbox data-plane token — the `sandbox_access_token` returned by the create/connect
        endpoints. Used for `/files`, Sandbox-Exec, and other data-plane endpoints; the control plane
        (`/api/v2`) does not accept it, and conversely the control plane''s `Authorization: Bearer` is
        invalid on the data plane.


        The token is bound to its sandbox: using sandbox A''s token against sandbox B''s host fails. It
        stays valid until the sandbox''s lifetime ends; there is no separate rotation endpoint (`rotate_traffic_token`
        rotates the port traffic token `traffic_access_token` and does not affect this one).

        '
