          description: 'Sandbox product specification id (catalog SKU, for example

            `gmi.sandbox.x-large`).

            '
    ProductCatalogItem:
      type: object
      additionalProperties: false
      required:
      - resource_type
      - product
      - name
      - status
      - resources
